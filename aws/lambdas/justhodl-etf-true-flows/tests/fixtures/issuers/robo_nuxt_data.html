GroupContainer":2519,"textItemsContainer":2522,"footerInnerContainer":2523,"footerOuterContainer":2524,"linkAndIconContainer":2525,"footerOuterContainer2":2526,"topFooterTextContainer":2527},{},{"display":125,"justify-content":2438},{},{"margin-bottom":2505},"2px !important",{},{},{},{},{},{"background-color":2443},{"padding":2513,"justify-content":2514},"10px 20px","space around",{},{},{"color":2518,"align-items":47,"justify-content":47},"#e5e5e5",{"padding":2520,"text-align":2521,"justify-content":2446},"20px 20px","initial",{"text-align":2521},{"":12},{"background-color":2443},{},{"background-color":2443},{"background-color":2443},"\u003Cp>\u003Cstrong>\u003Cem>Carefully consider the Funds&rsquo; investment objectives, risk factors, charges and expenses before investing. This and additional information can be found on the Funds&#39; full or summary prospectuses, which may be obtained at www.roboglobaletfs.com. Read the prospectus carefully before investing.\u003C/em>\u003C/strong>\u003C/p>\n\u003Cp>Investing involves risk, including the possible loss of principal. International investments may also involve risk from unfavorable fluctuations in currency values, differences in generally accepted accounting principles, and from economic or political instability. Emerging markets involve heightened risks related to the same factors as well as increased volatility and lower trading volume. Narrowly focused investments and investments in smaller companies typically exhibit higher volatility. There is no guarantee the funds will achieve their stated objective.&nbsp;ROBO and&nbsp;HTEC are diversified.&nbsp;THNQ is&nbsp;non-diversified.\u003C/p>\n\u003Cp>The liquidity of the A-shares market and trading prices of A-shares could be more severely affected than the liquidity and trading prices of other markets because the Chinese government restricts the flow of capital into and out of the A-shares market. The funds may experience losses due to illiquidity of the Chinese securities markets or delay or disruption in execution or settlement of trades.\u003C/p>\n\u003Cp>The risks associated with investments in Robotics and Automation Companies include, but are not limited to, small or limited markets for such securities, changes in business cycles, world economic growth, technological progress, rapid obsolescence, and government regulation. Robotics and Automation Companies, especially smaller, start-up companies, tend to be more volatile than securities of companies that do not rely heavily on technology. Rapid change to technologies that affect a company&#39;s products could have a material adverse effect on such company&#39;s operating results. Robotics and Automation Companies may rely on a combination of patents, copyrights, trademarks and trade secret laws to establish and protect their proprietary rights in their products and technologies. There can be no assurance that the steps taken by these companies to protect their proprietary rights will be adequate to prevent the misappropriation of their technology or that competitors will not independently develop technologies that are substantially equivalent or superior to such companies&#39; technology.\u003C/p>\n\u003Cp>The risks associated with Artificial Intelligence (AI) Companies include, but are not limited to, small or limited markets, changes in business cycles, world economic growth, technological progress, rapid obsolescence, and government regulation. Rapid change to technologies that affect a company&rsquo;s products could have a material adverse effect on such company&rsquo;s operating results. AI Companies also rely heavily on a combination of patents, copyrights, trademarks and trade secret laws to establish and protect their proprietary rights in their products and technologies. There can be no assurance that the steps taken by these companies to protect their proprietary rights will be adequate to prevent the misappropriation of their technology or that competitors will not independently develop technologies that are substantially equivalent or superior to such companies&rsquo; technology. AI Companies typically engage in significant amounts of spending on research and development, and there is no guarantee that the products or services produced by these companies will be successful.\u003C/p>\n\u003Cp>The risks associated with Medical Technology Companies include, but are not limited to, small or limited markets for such securities, changes in business cycles, world economic growth, technological progress, rapid obsolescence, and government regulation.\u003C/p>\n\u003Cp>Diversification may not protect against market risk.\u003C/p>\n\u003Cp>Beginning September 2, 2020, market price returns are based on the official closing price of an ETF share or, if the official closing price isn&#39;t available, the midpoint between the national best bid and national best offer (&ldquo;NBBO&rdquo;) as of the time the ETF calculates current NAV per share. Prior to September 2, 2020, market price returns were based on the midpoint between the Bid and Ask price. NAVs are calculated using prices as of 4:00 PM Eastern Time. The returns shown do not represent the returns you would receive if you traded shares at other times.\u003C/p>\n\u003Cp>The Funds are distributed by SEI Investments Distribution Co. (SIDCO) 1 Freedom Valley Drive, Oaks, PA, 19456\u003C/p>","2020-06-05T15:07:26.614Z","2026-07-20T17:45:30.403Z","hf07gowbz6qlsu77fm6azig3","2026-07-20T17:45:30.398Z","https://cdn-webmaker1.nyc3.digitaloceanspaces.com/faa33f22_f0a2_4f4c_a22e_baa47972a32d_5905eaa6c5.png",{"id":1181,"siteId":59,"devUrl":2381,"prodUrl":2382,"postsCategories":2535,"fundTickers":2388,"pagesList":2389,"style":4,"createdAt":2390,"updatedAt":2391,"documentId":2392,"publishedAt":2393},[2536],{"key":2386,"name":2387},["Reactive",2538],{"id":112,"title":2539,"text":2540,"cancel":2541,"navigate":2542,"cssStyleSheet":2543,"siteId":59,"componentType":2544,"componentId":2545,"createdA
