<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JustHodl — ICE history recovery</title>
<style>
 body{background:#0d1117;color:#c9d1d9;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:28px 22px;}
 h1{font-size:17px;color:#e6edf3;margin:0 0 4px;letter-spacing:.02em}
 p.sub{color:#7d8590;margin:0 0 18px;font-size:12.5px}
 input[type=file]{color:#c9d1d9;font-size:13px;margin-bottom:14px}
 #bar{height:4px;background:#21262d;border-radius:2px;margin:14px 0 12px;overflow:hidden}
 #fill{height:100%;width:0;background:#2ea043;transition:width .3s}
 #log{white-space:pre-wrap;font-size:12.5px;max-height:62vh;overflow:auto;border-top:1px solid #21262d;padding-top:12px}
 .ok{color:#3fb950}.warn{color:#d29922}.err{color:#f85149}.dim{color:#6e7681}
</style>
</head>
<body>
<h1>ICE BofA history recovery</h1>
<p class="sub">Choose the <code>jh-ice.json</code> file saved by the grabber script.
This page runs on your own origin, so the upload is not intercepted.</p>
<input type="file" id="pick" accept=".json,application/json">
<div id="bar"><div id="fill"></div></div>
<div id="log"></div>
<script>
(function () {
  'use strict';
  var INGEST = '__INGEST__';
  var TOKEN = '__TOKEN__';

  var logEl = document.getElementById('log');
  var fillEl = document.getElementById('fill');
  var pickEl = document.getElementById('pick');

  function say(msg, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function postBatch(batch) {
    try {
      var res = await fetch(INGEST, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, kind: 'series',
                               series: batch })
      });
      return await res.json();
    } catch (err) {
      return { ok: false, error: String(err) };
    }
  }

  pickEl.addEventListener('change', async function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    pickEl.disabled = true;

    say('reading ' + file.name + ' (' +
        Math.round(file.size / 1024) + ' KB)…');

    var text = await file.text();
    var data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      say('could not parse file: ' + err, 'err');
      return;
    }
    if (!Array.isArray(data) || !data.length) {
      say('file contains no series', 'err');
      return;
    }
    say(data.length + ' series in file');

    var banked = 0;
    var batch = [];

    for (var i = 0; i < data.length; i++) {
      var s = data[i];
      fillEl.style.width = (100 * (i + 1) / data.length) + '%';
      if (!s || !s.id || !Array.isArray(s.rows) || s.rows.length < 50) {
        say('  ' + (s && s.id) + ' — too few rows, skipped', 'dim');
        continue;
      }
      say('  ' + s.id + ': ' + s.rows.length + ' rows  ' +
          s.rows[0][0] + ' -> ' + s.rows[s.rows.length - 1][0]);
      batch.push(s);
      if (batch.length >= 3) {
        var r = await postBatch(batch);
        if (r && r.ok) {
          banked += (r.banked || batch.length);
          say('    uploaded ' + (r.banked || batch.length), 'ok');
        } else {
          say('    upload failed: ' + JSON.stringify(r).slice(0, 160),
              'err');
        }
        batch = [];
      }
    }
    if (batch.length) {
      var r2 = await postBatch(batch);
      if (r2 && r2.ok) {
        banked += (r2.banked || batch.length);
        say('    uploaded ' + (r2.banked || batch.length), 'ok');
      } else {
        say('    upload failed: ' + JSON.stringify(r2).slice(0, 160),
            'err');
      }
    }

    say('');
    say('DONE — ' + banked + ' series banked to S3',
        banked ? 'ok' : 'err');
    pickEl.disabled = false;
  });
})();
</script>
</body>
</html>
