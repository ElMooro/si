<meta charset="UTF-8">

<style>
:root{
  --bg:#0a0e14;--panel:#0f131a;--panel2:#11161f;--line:#1c2433;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --txt:#e6eaf2;--mute:#a8b3c7;--dim:#6f7b91;
  --green:#26ffaf;--red:#ff5577;--orange:#ff7a18;--yellow:#ffd266;--cyan:#00d4ff;--purple:#a78bfa;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;margin:0;font-size:14px;line-height:1.5}
.container{max-width:1180px;margin:0 auto;padding:24px}
header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
h1{font-family:var(--mono);font-size:21px;letter-spacing:1px;text-transform:uppercase;margin:0 0 6px;color:var(--yellow)}
.subtitle{color:var(--mute);font-size:12.5px;margin:0;max-width:1000px}
nav.crumbs{margin-top:10px}
nav.crumbs a{color:var(--mute);text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px dashed var(--line);margin-right:14px}
nav.crumbs a:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
.hero{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:8px;padding:18px;margin-bottom:14px}
.hero .ptag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.hero .post{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:1.5px;margin-bottom:4px}
.hero .post.defensive{color:var(--red)}
.hero .post.defensive_tilt{color:var(--orange)}
.hero .post.neutral{color:var(--mute)}
.hero .post.risk_on_tilt{color:var(--cyan)}
.hero .post.risk_on{color:var(--green)}
.hero .hl{font-family:var(--mono);font-size:12.5px;color:var(--mute);line-height:1.65;margin-top:10px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.schip{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.schip .sl{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.schip .sv{font-family:var(--mono);font-size:21px;font-weight:700;margin-top:3px}
.sechead{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
.alloctab{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.alloctab th,.alloctab td{padding:9px 12px;text-align:left;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--line)}
.alloctab th{background:var(--panel2);color:var(--dim);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;font-weight:normal}
.alloctab td.num{text-align:right;font-weight:700}
.alloctab td.delta.pos{color:var(--green)}
.alloctab td.delta.neg{color:var(--red)}
.alloctab td.delta.zero{color:var(--mute)}
.bar{display:inline-block;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;vertical-align:middle;width:100px;position:relative;margin-left:8px}
.bar i{display:block;height:100%}
.chart{width:100%;height:280px;margin-top:6px}
.contribs{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.contrib-asset{margin-bottom:11px;border-bottom:1px solid var(--line);padding-bottom:9px}
.contrib-asset:last-child{border-bottom:none}
.contrib-asset .ca-h{font-family:var(--mono);font-size:12.5px;color:var(--txt);font-weight:700;margin-bottom:4px}
.contrib-asset .ca-h .cnum{font-weight:400;color:var(--mute);margin-left:7px;font-size:11px}
.contrib-asset .cr{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:14px;line-height:1.7}
.contrib-asset .cr .cpp{font-weight:700;color:var(--txt)}
.contrib-asset .cr .cpp.pos{color:var(--green)}
.contrib-asset .cr .cpp.neg{color:var(--red)}
.signals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.scard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:8px;padding:12px 13px}
.scard.in{border-left-color:var(--cyan)}
.scard .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.scard .sn{font-family:var(--mono);font-size:12.5px;color:var(--txt);font-weight:700}
.scard .sv{font-family:var(--mono);font-size:13px;color:var(--cyan);font-weight:700}
.scard .sr{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:3px;display:flex;justify-content:space-between}
.scard .sr b{color:var(--txt)}
.method{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:11.5px;color:var(--mute);line-height:1.65;margin-top:18px}
.method b{color:var(--txt)}
.note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:18px;line-height:1.6}
.ts{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}
.fail{padding:18px;color:var(--mute);font-family:var(--mono);font-size:12px}
.ma-scroll{max-width:100%;overflow-x:auto} .ma-scroll table{min-width:640px} #root h2{font:600 16px var(--mono);margin-top:24px} #root pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;font:11px var(--mono)} #root details{margin-top:24px} #root td{padding:10px 8px} #root a{color:var(--yellow)}
</style>
</head>
