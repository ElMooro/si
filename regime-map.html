<style>

/* ---------- the heat map (2026-11-24) ----------

.rm-top h1{font-size:19px;margin:0;font-weight:700;color:#fff}

.rm-c-state{display:flex;align-items:center;gap:7px;font-size:13px}.rm-c-state i{width:12px;height:12px;border-radius:2px}.rm-c-state b{color:#fff}.rm-c-state span{color:var(--rm-ink2);font-size:12px}
.rm-c-why{color:var(--rm-ink2);margin:4px 0 6px}
.rm-c-w{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-bottom:6px}
.rm-c-w th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--rm-ink3);font-weight:600;text-align:right;padding:2px 4px}
.rm-c-w td{text-align:right;padding:2px 4px;border-top:1px solid var(--rm-line)}.rm-c-w td:first-child{text-align:left;color:var(--rm-ink2)}
.rm-c-l{color:var(--rm-ink2);margin-top:3px}.rm-c-l b{color:#fff}
.rm-c-n{margin-top:5px;padding:5px 7px;border-left:2px solid var(--rm-acc);background:rgba(240,180,41,.08);color:var(--rm-ink)}
.rm-c-b{margin-top:9px}
.rm-open{background:var(--rm-acc);border:0;color:#0C0B09;border-radius:5px;padding:7px 12px;font:600 12.5px var(--sans);cursor:pointer;width:100%}

@media(max-width:820px){.rm-b-two,.rm-lists{grid-template-columns:1fr}.rm-seg{max-width:100%;overflow-x:auto}.rm-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.rm-chips button{white-space:nowrap;flex:none}.rm-lists>section{min-width:0}.rm-top h1 span{display:block;margin:2px 0 0}.rm-view{margin-left:0}.rm-card,.rm-card.rm-left{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:12px 12px 0 0;max-height:72vh}.rm-page{padding:8px 6px 70px}.rm-b-l{font-size:17px}}

/* ---------- the previous view (the first Risk Map, as it was) ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:12px 4px 80px;color:var(--fg-0)}
.wrap h1{font-size:21px;margin:0 0 2px}.wrap .sub{color:var(--fg-2);font-size:13px;margin-bottom:14px;max-width:820px}

</style></head><body>
<div class="rm-page">
  <div class="rm-top">
    <h1>Risk Map <span>what's booming vs getting destroyed, across every asset class</span></h1>
    <div class="rm-view" role="group" aria-label="View">
      <button type="button" id="rm-v-map" class="on">Heat map</button>
      <button type="button" id="rm-v-classic" title="The Risk Map as it was before 24 November 2026: 38 instruments in seven sleeves">Previous view</button>
    </div>
  </div>
  <div id="rm-app"><div class="rm-loading">Mapping the tape…</div></div>
  <div class="wrap" id="wrap" hidden><div class="loading">Mapping the tape…</div></div>
</div>
<script src="/jh-risk-map.js?v=20261124b"></script>
<script>
const PROXY="https://justhodl-data-proxy.raafouis.workers.dev";
async function gj(p){try{const r=await fetch(`/${p}?t=${Date.now()}`,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}try{const r=await fetch(`https://justhodl.ai/${p}?t=${Date.now()}`);if(r.ok)return await r.json();}catch(e){}try{const r=await fetch(`${PROXY}/${p}?t=${Date.now()}`);if(r.ok)return await r.json();}catch(e){}return null;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function col(ro){const a=Math.min(1,Math.abs(ro)/100);if(ro>0)return`background:rgba(63,214,140,${.10+.45*a});border-color:rgba(63,214,140,${.3+.4*a})`;if(ro<0)return`background:rgba(255,92,108,${.10+.45*a});border-color:rgba(255,92,108,${.3+.4*a})`;return'background:var(--bg-2)';}
function txt(ro){return ro>0?'var(--green)':ro<0?'var(--red)':'var(--fg-1)'}
const REG={'BIFURCATED':'--amber','BROAD RISK-ON':'--green','BROAD RISK-OFF':'--red','NARROW / CONCENTRATED':'--amber','MIXED / ROTATIONAL':'--fg-2'};

/* The previous view: the first Risk Map's page, drawn from the same document's first-map fields (38 instruments, seven sleeves).
   Two lines are new: an empty list says so, and turns are shown only when the document says which run they are measured from. */
function classic(d){
  const w=document.getElementById('wrap');
  if(!d||!d.ok){w.innerHTML='<h1>Risk Map</h1><div class="loading">No read yet — updates 21:00 UTC.</div>';return;}
  const r=d.regime, c=`var(${REG[r.label]||'--fg-2'})`;
  let h=`<h1>🗺️ Risk Map <span style="color:var(--fg-3);font-size:13px">booming vs getting destroyed</span></h1>`;
  h+=`<div class="sub">${esc(d.thesis||'')}</div>`;
  h+=`<div class="meta">${d.n_instruments} instruments · ${(d.generated_at||'').slice(0,16).replace('T',' ')}Z · ${esc(d.windows||'')}</div>`;
  h+=`<div class="banner" style="border-left:4px solid ${c}"><div class="lab" style="color:${c}">${esc(r.label)}</div><div class="sm">${esc(r.summary)}</div></div>`;
  h+=`<div class="chips">
    <div class="chip"><b>Equities</b><span style="color:${txt(r.equity_avg)}">${r.equity_avg>0?'+':''}${r.equity_avg}</span></div>
    <div class="chip"><b>Crypto</b><span style="color:${txt(r.crypto_avg)}">${r.crypto_avg>0?'+':''}${r.crypto_avg}</span></div>
    <div class="chip"><b>Rates/Credit</b><span style="color:${txt(r.rates_avg)}">${r.rates_avg>0?'+':''}${r.rates_avg}</span></div>
    <div class="chip"><b>Commod/Haven</b><span style="color:${txt(r.commodities_avg)}">${r.commodities_avg>0?'+':''}${r.commodities_avg}</span></div>
    <div class="chip"><b>Equity Breadth</b><span>${r.equity_breadth_pct}%</span></div>
    <div class="chip"><b>Concentration</b><span>${r.concentration_spread_3m>0?'+':''}${r.concentration_spread_3m}pts</span></div>
  </div>`;
  const rowHtml=x=>`<div class="row"><span class="tk" style="color:${txt(x.risk_on)}">${esc(x.ticker)}</span><span class="nm">${esc(x.name)}</span><span class="ro" style="color:${txt(x.risk_on)}">${x.risk_on>0?'+':''}${x.risk_on}</span><span class="rr">${x.r3m>0?'+':''}${x.r3m}%</span></div>`;
  const none=s=>`<div class="note" style="margin-top:0">None of the ${d.n_instruments} is ${s} today.</div>`;
  h+=`<div class="cols"><div class="col b"><h3>🔥 Booming · risk-on</h3>${(d.booming||[]).map(rowHtml).join('')||none('booming')}</div>
    <div class="col d"><h3>💀 Getting destroyed · risk-off</h3>${(d.destroyed||[]).map(rowHtml).join('')||none('being destroyed')}</div></div>`;
  // turns & transitions
  const turnsOk=!d.contract||!!d.turns_since;
  if(d.regime_changed&&turnsOk){h+=`<div class="banner" style="border-left:4px solid var(--amber);margin-top:12px"><b style="color:var(--amber)">⚠ REGIME CHANGE</b> — shifted from <b>${esc(d.prev_regime)}</b> to <b>${esc(r.label)}</b> since the last run.</div>`;}
  if(turnsOk&&(d.transitions||[]).length){
    const KC={'BOTTOMING / RECOVERING':'var(--green)','ACCELERATING':'var(--green)','FLIPPED RISK-ON':'var(--green)','STRENGTHENING':'var(--green)','ROLLING OVER':'var(--red)','CAPITULATING':'var(--red)','FLIPPED RISK-OFF':'var(--red)','WEAKENING':'var(--amber)'};
    h+=`<h2>⟳ Turns & transitions <span style="color:var(--fg-3);font-weight:400;text-transform:none">— where the tape is changing (alpha is in the turn)</span></h2><div class="col">`;
    for(const t of d.transitions){const kc=KC[t.kind]||'var(--fg-2)';h+=`<div class="row"><span class="tk" style="color:${txt(t.delta)}">${esc(t.ticker)}</span><span class="nm">${esc(t.name)}</span><span style="font-family:var(--mono);font-size:11px;color:var(--fg-2)">${esc(t.from)}→${esc(t.to)}</span><span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${kc};width:140px;text-align:right">${esc(t.kind)}</span><span class="ro" style="color:${txt(t.delta)}">${t.delta>0?'+':''}${t.delta}</span></div>`;}
    h+=`</div>`;
  } else if(!turnsOk){ h+=`<h2>⟳ Turns & transitions</h2><div class="note" style="margin-top:0">Turns show from the next run: this publication is the first by the new measure, and has no earlier one to be compared with.</div>`; }
  else { h+=`<h2>⟳ Turns & transitions</h2><div class="note" style="margin-top:0">No state changes since the prior run — the map is stable. Transitions populate as sleeves cross between BOOMING / RISK-ON / NEUTRAL / RISK-OFF / DESTROYED.</div>`; }
  h+=`<h2>Full map — every sleeve</h2>`;
  for(const[sl,items] of Object.entries(d.sleeves||{})){
    h+=`<div class="sleeve"><div class="st">${esc(sl)}</div><div class="grid">`;
    for(const x of items){h+=`<div class="cell" style="${col(x.risk_on)}"><div class="ct" style="color:${txt(x.risk_on)}">${esc(x.ticker)} ${x.risk_on>0?'+':''}${x.risk_on}</div><div class="cs" style="color:${txt(x.risk_on)}">${esc(x.state)}</div><div class="cr">${esc(x.name)} · ${x.r3m>0?'+':''}${x.r3m}%</div></div>`;}
    h+=`</div></div>`;
  }
  h+=`<div class="note">risk-on score (−100..+100) blends multi-window momentum (1m/3m/6m) with trend vs 50/200-day moving averages. Regime classifier reads the dispersion: cap-weight vs equal-weight concentration spread, equity breadth %, and the equity-vs-crypto split — so it can tell a <b>broad</b> rally from a <b>narrow</b> megacap-led one from a <b>bifurcated</b> tape. Research, not investment advice.</div>`;
  w.innerHTML=h;
}
