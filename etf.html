<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF Research Desk · JustHodl</title>
<meta name="description" content="ETF Research Desk. Dense sortable view of fund flows, holdings, look-through, issuer share research, ETF census, moving averages, price-spread tightness, effort versus results, most stocks held, added, and deleted.">
<style>
html,body{margin:0;height:100%;background:#131722;color:#d1d4dc}
#etf-desk-host{height:100vh;width:100%;overflow:hidden}
form[data-ed-scenario]{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head><body>
<div id="etf-desk-host"><div style="padding:16px;color:#787b86;font:13px system-ui,sans-serif">Loading ETF Research Desk…</div></div>
<form data-ed-scenario aria-hidden="true" tabindex="-1">
<label>Signed position · USD<input name="position" type="number" step="any" value="0" autocomplete="off"></label>
<label>Your assumed fund return · %<input name="shock" type="number" step="any" value="0" autocomplete="off"></label>
<label>Your assumed total costs · USD<input name="cost" type="number" step="any" value="0" autocomplete="off"></label>
<button type="submit">Calculate hypothetical outcome</button>
</form>
<script src="/jh-etf-desk-overlay.js?v=20261013etf4"></script>
<script src="/jh-etf-desk-page.js?v=20260921-native1" defer></script>
<script>
(function () {
  function boot() {
    var host = document.getElementById("etf-desk-host");
    if (!host) return;
    if (window.jhEtfDeskOverlay) window.jhEtfDeskOverlay(host);
    else setTimeout(boot, 40);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--
ETF Research Desk. Visible surface is the dense overlay, not the evidence inspector.
Sections rendered here: fund flows with 1 day, 5 day and 21 day windows, color scaled,
holdings row counts, look-through across funds, issuer share research, ETF census,
price versus the 9, 20, 50, 100, 200 and 250 day moving averages, how tight the
price spreads are, effort versus results, most stocks held by ETFs, most stocks
added, and most stocks deleted. Column headers sort ascending and descending.
A ticker filter sits in the desk header. jh-etf-desk-page.js stays referenced for
the desk contract and only paints when main[data-etf-desk-page] is present.
This page does not include that host, so the chart button opens the new desk.
-->
</body></html>
