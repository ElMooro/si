<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Providers — JustHodl.AI</title>
<style>
body{margin:0;background:#070b10;color:#dfe9f2;font-family:'SF Mono',Consolas,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:26px 16px}
h1{font-size:20px;letter-spacing:3px;color:#8fd0ff;margin:0 0 4px}
.sub{color:#5d7285;font-size:11px;margin-bottom:18px}
.tot{display:flex;gap:26px;margin:14px 0 22px;flex-wrap:wrap}
.tot div{background:#0d141c;border:1px solid #1c2733;border-radius:10px;padding:10px 18px}
.tot b{display:block;font-size:22px;color:#e8f1f8}.tot span{font-size:10px;color:#5d7285;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
a.card{display:block;background:#0d141c;border:1px solid #1c2733;border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s}
a.card:hover{border-color:#2f4a6a}
.nm{color:#cfe3f5;font-weight:700;font-size:13px}
.api{color:#4f6a7d;font-size:10px;margin:3px 0 8px;word-break:break-all}
.stats{display:flex;gap:14px;font-size:11px}
.stats b{color:#9fd0a8}.stats i{font-style:normal;color:#69808f}
.fr{font-size:10px;margin-top:6px}
.roll{margin:0 0 18px;padding:12px 14px;background:#0d141c;border:1px solid #1c2733;border-radius:10px;font-size:11px;color:#9db4c6}
</style></head><body><div class="wrap">
<h1>DATA</h1><div class="sub">Every provider · catalog + consumption + theme rollups (ops 5400-5403). Eurostat/GDELT shown as themes, not raw dumps.</div>
<div id="ih" style="display:none;margin:10px 0 14px;padding:10px 14px;background:#0d141c;border:1px solid #1c2733;border-radius:10px;font:12px ui-monospace,Menlo,monospace"></div>
<div id="roll" class="roll">theme rollups loading…</div>
<div class="tot" id="tot"></div><div class="grid" id="g">Loading…</div>
</div>
<script>
fetch('/data/import-health.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(function(h){
 if(!h)return;var C={HEALTHY:'#6fce8a',DEGRADED:'#F0B429',ACTION_REQUIRED:'#E07A6A'};
 var PC={OK:'#6fce8a',COMPLETE:'#6fce8a',RUNNING:'#7fb4e0',STALLED:'#F0B429',STALE:'#F0B429',WEDGED:'#E07A6A',BLOCKED:'#E07A6A',BLOCKED_403:'#E07A6A',ACTION_REQUIRED:'#E07A6A',KEY_INVALID:'#E07A6A',NO_STATE:'#5b6479',UNKNOWN:'#5b6479'};
 var pipes=h.pipelines||[];
 var f=pipes.filter(function(p){return p.name==='fred'})[0]||{};
 var chips=pipes.map(function(p){var c=PC[p.status]||'#5b6479';
  return '<span title="'+((p.detail||'')+(p.age_min!=null?' · '+p.age_min+'m':''))+'" style="display:inline-block;margin:2px 8px 2px 0;color:'+c+'">●&nbsp;'+p.name+' <b>'+p.status+'</b></span>';}).join('');
 var remain=Math.max(0,(f.queue_total||0)-(f.queue_cursor||0));
 var fredDone=String(f.status||'')==='COMPLETE' || remain===0 && (f.queue_total||0)>0;
 var fr='';
 if(f.imported!=null){
  fr='&nbsp;·&nbsp;FRED banked '+(f.imported||0).toLocaleString()+' crawler-imported';
  if(fredDone) fr+=' · drain COMPLETE'+(f.detail?(' ('+f.detail+')'):'')+' · card uses stored-series count';
  else fr+=' · queue '+(f.queue_cursor||0)+'/'+(f.queue_total||0)+(f.scope?(' · '+f.scope):'');
 }
 var why='';
 if(h.overall && h.overall!=='HEALTHY'){
  var w=h.worst && pipes.filter(function(p){return p.name===h.worst})[0];
  if(w) why='&nbsp;·&nbsp;reason <b>'+w.name+'</b> '+w.status+(w.detail?(' — '+w.detail):'');
 }
 var el=document.getElementById('ih');el.style.display='block';
 el.innerHTML='<span style="color:'+(C[h.overall]||'#e8e8e8')+';font-weight:800">IMPORT '+h.overall+'</span>'+why+fr+'<div style="margin-top:6px">'+chips+'</div>';
}).catch(function(){});
Promise.all([
 fetch('/data/theme-eurostat.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
 fetch('/data/theme-gdelt.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
 fetch('/data/desk-rollup.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
]).then(function(x){
 var eu=x[0]||{}, gd=x[1]||{}, d=x[2]||{};
 var alerts=((d.import_health_alerts)||[]).map(function(p){return (p.name||'?')+':'+(p.status||'');}).join(' · ')||'none';
 document.getElementById('roll').innerHTML=
  '<b style="color:#8fd0ff">THEMES</b> · Eurostat '+(eu.series_count?eu.series_count.toLocaleString()+' series / ':'')+(eu.mb||'—')+' MB · GDELT '+(gd.datasets?gd.datasets.toLocaleString()+' files / ':'')+(gd.mb||'—')+' MB'
  +'<div style="margin-top:6px;color:#e0b552">desk alerts: '+alerts+'</div>'
  +'<div style="margin-top:4px;color:#5d7285">'+(d.how_to_read_command_desk_flags||'command-desk RED/AMBER = section flags + freshness, not one bug')+'</div>';
}).catch(function(){document.getElementById('roll').textContent='theme rollups not written yet — ops 5403';});
function paint(d,c){
 var t=d.totals||{};var tot=document.getElementById('tot');
 tot.innerHTML=
  '<div><b>'+(t.providers||0)+'</b><span>PROVIDERS</span></div>'+
  '<div><b>'+((d.datasets_total||t.datasets||t.keys)||0).toLocaleString()+'</b><span>DATASETS / FILES</span></div>'+
  '<div><b>'+(t.keys||0).toLocaleString()+'</b><span>S3 KEYS</span></div>'+
  '<div><b>'+(t.gb||0)+' GB</b><span>WARM + HOT</span></div>';
 var cc=(c&&c.counts)||null;
 if(cc){
  tot.innerHTML +=
   '<div><b>'+String(cc.orphan||0)+'</b><span>ORPHAN</span></div>'+
   '<div><b>'+String(cc.cancel_or_dead||0)+'</b><span>CANCEL</span></div>';
 }
 var cmap={};
 try{(c&&c.providers||[]).forEach(function(x){if(x&&x.slug)cmap[x.slug]=x;});}catch(e0){}
 var g=document.getElementById('g');g.innerHTML='';
 (d.providers||[]).forEach(function(p){
  var a=document.createElement('a');a.className='card';a.href='/provider.html?p='+p.slug;
  var fh=p.freshest_h,fc=fh==null?'#5d7285':(fh<=26?'#5fbf7f':'#e05252');
  var cv=cmap[p.slug];
  a.innerHTML='<div class="nm">'+p.name+'</div><div class="api">'+p.api+'</div>'+
   '<div class="stats"><span><b>'+p.n_keys+'</b> <i>keys</i></span><span><b>'+p.total_mb+'</b> <i>MB</i></span></div>'+
   '<div class="fr" style="color:'+fc+'">freshest '+(fh==null?'—':fh+'h')+'</div>';
  if(cv&&cv.verdict){
   var col=cv.verdict==='KEEP'?'#5fbf7f':(cv.verdict==='ORPHAN'?'#e0b552':'#e05252');
   a.innerHTML += '<div style="font-size:9px;margin-top:4px;color:'+col+'">'+cv.verdict+'</div>';
  }
  g.appendChild(a);
 });
}
Promise.all([
 fetch('/data/provider-catalog.json?t='+Date.now()).then(function(r){return r.json();}),
 fetch('/data/provider-consumption.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
]).then(function(pair){paint(pair[0],pair[1]);})
 .catch(function(){document.getElementById('g').textContent='catalog unavailable';});
</script>
<script src="/jh-nav-drawer.js" defer></script><script src="/sidebar.js" defer></script>
</body></html>
