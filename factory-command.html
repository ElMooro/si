<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory command · JustHodl.AI</title>
<style>
body{margin:0;background:#0c0b09;color:#e8edf3;font:14px/1.45 ui-sans-serif,system-ui}
.wrap{max-width:820px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:6px 0 12px}
.k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a7f6e}
.card{border:1px solid #2a241c;border-radius:10px;padding:14px;margin:0 0 12px;background:#120f0c}
.dim{color:#8a7f6e}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #2a241c;padding:6px 4px;text-align:left}
a{color:#c4a574}
</style>
</head>
<body>
<main class="wrap">
  <p class="k">Factory command doctrine</p>
  <h1>Army of agents — ranks, evidence, kill</h1>
  <p class="dim">Teachers (Claude / Grok) install skills, then leave. Daily thought does not call them. Student-state is private; this page is the public standing order.</p>
  <div class="card" id="doc"></div>
  <p class="dim"><a href="/ai.html">AI desk</a> · constitution stays 401 anonymous</p>
</main>
<script>
fetch("/config/factory-doctrine.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  var ranks=(d.ranks||[]).map(function(x){
    return "<tr><td>"+x.rank+"</td><td>spawn "+x.can_spawn+"</td><td>"+x.authority+"</td></tr>";
  }).join("");
  document.getElementById("doc").innerHTML =
    "<p class=k>Standing order</p><p>"+d.purpose+"</p>"+
    "<table><thead><tr><th>Rank</th><th>Spawn</th><th>Authority</th></tr></thead><tbody>"+ranks+"</tbody></table>"+
    "<p class=k style=margin-top:12px>Promote</p><p>"+JSON.stringify(d.promotion)+"</p>"+
    "<p class=k>Eliminate</p><p>rogue / hallucinating / stalled → retire the card. Evidence stays.</p>"+
    "<p class=k>Command</p><p>"+d.chain_of_command.orders_flow+". Grader is not the student. Teachers cannot mint owner.</p>";
}).catch(function(){
  document.getElementById("doc").textContent="doctrine file not on this bake yet";
});
</script>
</body>
</html>
