# build_trigger = redeploy 2026-05-16T2325 — node22 fix live
name = "justhodl-ai-proxy"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Publish to <worker>.<account-subdomain>.workers.dev
# (Cloudflare made this opt-in as of 2025-09-17 for security.)
workers_dev = true

# Bind the branded custom domain. Cloudflare auto-provisions TLS and a
# proxied A record for this hostname. Requires the justhodl.ai zone to
# be on Cloudflare (nameserver-migrated 2026-04-23).
[[routes]]
pattern = "api.justhodl.ai"
custom_domain = true

# Observability: send logs to CF dashboard
[observability]
enabled = true

# AI control identity configuration. The publishable Supabase key and JWKS URL
# are public identifiers (not secrets). Tokens are verified locally against the
# issuer's asymmetric keys; /auth/v1/user is the fail-closed verifier for any
# legacy symmetric Supabase tokens during key migration.
[vars]
SUPABASE_URL = "https://bdmjenqcyvzouusfcgow.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_W6V6OaQ9aXvpVVV9k4Lrpg_pCPuBLvB"
AUTH_JWKS_URL = "https://bdmjenqcyvzouusfcgow.supabase.co/auth/v1/.well-known/jwks.json"
AUTH_ISSUER = "https://bdmjenqcyvzouusfcgow.supabase.co/auth/v1"
AUTH_AUDIENCE = "authenticated"
OWNER_EMAILS = "raafouis@gmail.com"
ADMIN_ROLES = "admin"
AI_MAX_BODY_BYTES = "65536"
AI_REPLAY_WINDOW_SECONDS = "300"

# Atomic per-verified-subject quotas and replay nonces for /ai control routes.
[[durable_objects.bindings]]
name = "AI_REQUEST_GUARD"
class_name = "AiRequestGuard"

[[migrations]]
tag = "ai-request-guard-v1"
new_sqlite_classes = ["AiRequestGuard"]

# AI_CHAT_TOKEN and portfolio credentials remain encrypted Worker Secrets set
# by the GitHub Actions deploy workflow from AWS SSM.
