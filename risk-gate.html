<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Risk Gate · JustHodl AI</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#0f1319;--line:#30363d;--tx:#e8e8e8;--dim:#9aa4b2;--dim2:#6b7480;--amber:#F0B429;--amber2:#c99418;--green:#6fce8a;--red:#E07A6A;--sev:#ff9c8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:18px}
a{color:var(--amber)}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:22px 0 8px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.card2{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-legs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.big{font-size:34px;font-weight:800}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px}
.p-RISK_ON{background:#12331d;color:var(--green)}
.p-NEUTRAL{background:#2a2a14;color:var(--amber)}
.p-RISK_OFF{background:#33170f;color:var(--red)}
.p-SEVERE{background:#4a120a;color:var(--sev)}
.leg-neg{color:var(--red)}.leg-pos{color:var(--green)}.leg-zero{color:var(--dim)}
.stale{background:#2a2a14;color:var(--amber);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.missing{background:#33170f;color:var(--red);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.ok{background:#12331d;color:var(--green);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.age-fresh{color:var(--green)}.age-stale{color:var(--amber)}.age-old{color:var(--red)}
small{color:var(--dim)}
/* leg score gauge */
.gauge{position:relative;width:100%;height:8px;background:linear-gradient(90deg,#33170f 0%,#33170f 25%,#2a2a14 25%,#2a2a14 75%,#12331d 75%,#12331d 100%);border-radius:4px;margin:10px 0 4px;overflow:visible}
.gauge-mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx);border-radius:1px}
.gauge-mark-fused{position:absolute;top:-3px;width:2px;height:14px;background:var(--amber);border-radius:1px}
.gauge-mid{position:absolute;top:-1px;left:50%;width:1px;height:10px;background:#00000055}
/* posture timeline chart */
.tlchart{position:relative;height:60px;background:var(--card2);border-radius:6px;padding:8px;overflow:hidden}
.tlbar{position:absolute;bottom:8px;width:calc((100% - 16px)/31 - 1px);border-radius:2px}
/* fleet input rows */
.fi{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed #1e242c;font-size:11.5px}
.fi:last-child{border-bottom:none}
.fi .k{color:var(--tx);font-weight:600}
.fi .v{color:var(--dim);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.fi .adj{font-family:ui-monospace,monospace;font-size:11px;text-align:right;min-width:60px}
/* indicator row inside leg card */
.ind{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;padding:4px 0;font-size:12px}
.ind .lbl{color:var(--dim)}
.ind .val{font-family:ui-monospace,monospace;font-weight:600}
.ind .ctx{font-size:10.5px;color:var(--dim2)}
/* section rules */
.rule{border-left:2px solid var(--amber);padding:4px 8px;margin:6px 0;background:#1a1704;border-radius:0 4px 4px 0;font-size:12.5px}
/* SVG chart container */
.chart{width:100%;background:var(--card2);border-radius:6px;padding:6px;margin:6px 0}
.legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:#1e242c;color:var(--dim);font-size:11px;margin-right:6px}
.crisis-lbl{fill:var(--red);font-size:9px;font-weight:700}
.crisis-band{fill:rgba(224,122,106,0.10)}
.zero-line{stroke:var(--dim2);stroke-dasharray:3,3;stroke-width:1}
/* summary strip */
.summary{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:10px;margin-bottom:12px}
@media (max-width:800px){.summary{grid-template-columns:1fr}}
/* age banner */
.age-banner{padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.age-banner.fresh{background:#12331d33;border:1px solid var(--green)}
.age-banner.stale{background:#2a2a1444;border:1px solid var(--amber)}
.age-banner.old{background:#33170f55;border:1px solid var(--red)}
/* leg score display */
.leg-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.leg-name{font-weight:800;font-size:14px;letter-spacing:0.5px}
.leg-score-block{text-align:right;font-family:ui-monospace,monospace;font-size:13px;min-width:110px}
.leg-score-block .raw{font-size:11px;color:var(--dim)}
.leg-score-block .fused{font-size:18px;font-weight:800}
/* percentile bar for indicators */
.pctbar{position:relative;width:80px;height:5px;background:#1e242c;border-radius:3px;display:inline-block;vertical-align:middle}
.pctbar-fill{position:absolute;top:0;left:0;height:100%;background:var(--amber);border-radius:3px}
.pctbar-mark{position:absolute;top:-2px;width:1px;height:9px;background:var(--tx)}
/* event-study bar chart */
.esrow{display:grid;grid-template-columns:80px 90px 1fr 60px;gap:8px;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px dashed #1e242c}
.esrow:last-child{border:none}
.esbar-wrap{position:relative;height:16px;background:#0b0b0b;border-radius:3px;overflow:hidden}
.esbar{position:absolute;top:0;height:100%;border-radius:3px}
.esbar-pos{background:linear-gradient(90deg,#6fce8a55,#6fce8a);left:50%}
.esbar-neg{background:linear-gradient(270deg,#E07A6A55,#E07A6A);right:50%}
.eszero{position:absolute;top:0;left:50%;width:1px;height:100%;background:var(--dim2)}
/* series-to-note table with description */
.s2n-row td{padding:6px 8px;vertical-align:top}
.s2n-code{font-family:ui-monospace,monospace;color:var(--amber);font-weight:600}
.s2n-desc{font-size:12px;color:var(--dim)}
.s2n-note{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim2)}
/* action strip */
.action-strip{background:linear-gradient(90deg,#2a2a14 0%,#161b22 60%);border:1px solid var(--amber);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:14px}
.action-strip .lbl{color:var(--amber);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:1px}
.action-strip .body{color:var(--tx);margin-top:2px}
</style></head><body>
<h1>🚦 Master Risk Gate</h1>
<div class="dim">Brain-constitutional 7-leg macro risk gate. Sizing gate before selection. Data drives every rule from Khalid's brain.</div>
<div id="root" class="card">Loading data/risk-gate.json…</div>
<script>
const SRC=['https://justhodl.ai/data/risk-gate.json',
           'https://justhodl-dashboard-live.s3.amazonaws.com/data/risk-gate.json'];

/* --- historical crisis windows (matches jh-enhance.js) --- */
const CRISES = [
  ["1997-07","1998-10","Asian/LTCM"],
  ["2000-03","2002-10","Dot-com"],
  ["2007-08","2009-06","GFC"],
  ["2011-07","2012-07","Euro debt"],
  ["2015-08","2016-02","China/oil"],
  ["2020-02","2020-05","COVID"],
  ["2022-01","2022-10","Rate shock"],
  ["2023-03","2023-05","SVB"]
];

/* --- indicator context (thresholds + descriptions from brain) --- */
const IND = {
  cp_ffr_bp:      {label:"CP–FFR spread",       unit:"bp",   good:"<25", bad:">75",  brain:"nmq5x1qrkm0cn", desc:"A2/P2 short paper stress vs Fed funds. Widens in liquidity crunches."},
  rrp_bn:         {label:"Fed RRP balance",     unit:"$B",   good:">100",bad:"<10",  brain:"nmq5x1e4os92j", desc:"Reverse repo cash buffer. Approaching zero = liquidity thinning fast."},
  reserves_13w_pct:{label:"Bank reserves 13w",  unit:"%",    good:">0",  bad:"<-3",  brain:"nmq5x1e4os92j", desc:"Banking system reserves 13-week change. QT draining is bearish."},
  sofr_iorb_bp:   {label:"SOFR–IORB",           unit:"bp",   good:"<3",  bad:">10",  brain:"tv-a56315720e79a9ea", desc:"Overnight funding vs Fed's ceiling. Elevated = repo dysfunction."},
  ccc_level:      {label:"CCC HY yield",        unit:"%",    good:"<8",  bad:">14",  brain:"tv-8711fbee989cf1eb", desc:"Junk-rated credit spread level. Rising = default risk repricing."},
  ccc_21d_pct:    {label:"CCC 21d change",      unit:"%",    good:"<0",  bad:">10",  brain:"tv-8711fbee989cf1eb", desc:"CCC yield 21-day move. Sharp spikes precede risk-off."},
  euro_hy_21d_pct:{label:"Euro HY 21d",         unit:"%",    good:"<0",  bad:">10",  brain:"tv-e38d57bffedb366a", desc:"European high-yield 21d move — global credit sync check."},
  dxy_63d_pct:    {label:"DXY 63d change",      unit:"%",    good:"<2",  bad:">6",   brain:"tv-ab761f92999efe68", desc:"Dollar index 63-day move. Rising DXY tightens global liquidity."},
  dgs10_63d_bp:   {label:"10Y yield 63d",       unit:"bp",   good:"<25", bad:">80",  brain:"nmq5x00zhe98n", desc:"US 10-year yield 63-day change. Rate shocks in bp."},
  usdjpy_21d_pct: {label:"USD/JPY 21d",         unit:"%",    good:"|<2|",bad:">5 or <-5", brain:"tv-f58a44fc2f839aac", desc:"Yen carry proxy. Sharp yen strength = carry unwind."},
  indpro_yoy_pct: {label:"IP YoY growth",       unit:"%",    good:">1",  bad:"<-1",  brain:"nmq5x00zh27pq", desc:"Industrial production year/year. Negative = recession signal."},
  vix:            {label:"VIX",                 unit:"",     good:"<20", bad:">30",  brain:"tv-14a76b6087dc80eb", desc:"S&P implied vol. >20 stressed, >30 crisis-adjacent, >40 panic."}
};

/* --- series-to-note enrichment (what each FRED/TV series measures) --- */
const SERIES_DESC = {
  RRPONTSYD:      "Fed reverse repo (RRP) balance — overnight parking of excess cash",
  WRESBAL:        "Aggregate reserves held by depository institutions at Fed",
  TOTRESNS:       "Total reserves of depository institutions",
  BOGMBBM:        "Board of Governors monetary base",
  CASACBW027SBOG: "Cash assets of commercial banks",
  SOFR:           "Secured Overnight Financing Rate",
  IORB:           "Interest on reserve balances (Fed ceiling)",
  BAMLH0A3HYC:    "BofA CCC-rated high-yield OAS",
  BAMLC0A4CBBB:   "BofA BBB corporate OAS",
  BAMLH0A0HYM2:   "BofA US high-yield master OAS",
  BAMLHE00EHYIOAS:"BofA Euro high-yield OAS",
  DTWEXBGS:       "Trade-weighted dollar (broad, goods)",
  DGS10:          "10-year Treasury constant maturity yield",
  DEXJPUS:        "USD/JPY exchange rate",
  INDPRO:         "Industrial production index (level)",
  VIXCLS:         "CBOE volatility index (close)",
  DCPN3M:         "3-month nonfinancial commercial paper rate",
  DFF:            "Effective federal funds rate",
  RIFSPPNA2P2D90NB:"A2/P2 spread — 90-day tier-2 commercial paper",
  SP500:          "S&P 500 total return index"
};

const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=(v,d=2)=>v==null?'—':(typeof v==='number'?(Math.abs(v)>=1e3?v.toLocaleString('en-US',{maximumFractionDigits:d}):v.toFixed(d)):esc(v));
const fmtVal=(v,d=2)=>{
  if(v==null) return '—';
  if(typeof v==='object') return '<span class="dim mono" style="font-size:10px">(composite)</span>';
  return fmt(v,d);
};

function ageHours(iso){
  if(!iso) return null;
  try{ return (Date.now()-new Date(iso).getTime())/3600000; }catch(e){return null;}
}
function ageLabel(h){
  if(h==null) return '—';
  if(h<1) return Math.round(h*60)+'m';
  if(h<24) return h.toFixed(1)+'h';
  return (h/24).toFixed(1)+'d';
}
function ageClass(h){
  if(h==null) return 'age-old';
  if(h<6) return 'age-fresh';
  if(h<24) return 'age-stale';
  return 'age-old';
}

/* Leg score gauge: -2 to +2 scale */
function gauge(raw, fused){
  const clamp=v=>Math.max(-2,Math.min(2,v??0));
  const pos=v=>((clamp(v)+2)/4)*100;
  const r=pos(raw), f=fused!=null?pos(fused):null;
  return `<div class="gauge" title="Score scale: -2 (risk-off) to +2 (risk-on)">
    <div class="gauge-mid"></div>
    <div class="gauge-mark" style="left:calc(${r}% - 1px)" title="raw score ${fmt(raw,2)}"></div>
    ${f!=null?`<div class="gauge-mark-fused" style="left:calc(${f}% - 1px)" title="fused (with fleet) ${fmt(fused,2)}"></div>`:''}
  </div>
  <div class="dim mono" style="font-size:9.5px;display:flex;justify-content:space-between;margin-top:1px">
    <span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span>
  </div>`;
}

/* Fleet input renderer with clean value display */
function fleetInputRow(x){
  const statCls = x.status==='OK'?'ok':x.status==='STALE'?'stale':x.status==='MISSING'?'missing':'stale';
  const isObj = typeof x.value==='object' && x.value!==null;
  let valDisplay;
  if(x.value==null){ valDisplay='<span class="dim">null</span>'; }
  else if(isObj){
    // Show first 1-2 meaningful keys, not raw JSON
    const keys=Object.keys(x.value).slice(0,2);
    const parts=keys.map(k=>{
      const v=x.value[k];
      const shown=typeof v==='number'?fmt(v,2):typeof v==='string'?(v.length>15?v.slice(0,15)+'…':v):JSON.stringify(v).slice(0,12);
      return `<span class="dim2">${esc(k)}=</span>${esc(shown)}`;
    });
    valDisplay=`<span title='${esc(JSON.stringify(x.value))}'>${parts.join(' · ')}</span>`;
  } else {
    valDisplay=fmt(x.value,2);
  }
  const adjCls = x.score_adj<0?'leg-neg':x.score_adj>0?'leg-pos':'dim';
  const ageStr = x.age_h!=null ? ` <span class="dim2" style="font-size:10px">${ageLabel(x.age_h)}</span>` : '';
  return `<div class="fi">
    <span class="${statCls}">${esc(x.status||'?')}</span>
    <div><span class="k">${esc(x.input)}</span>${ageStr}
      <div class="v" title="${esc(x.note||'')}">${valDisplay}</div>
    </div>
    <span class="adj ${adjCls}">adj ${fmt(x.score_adj,2)}</span>
  </div>`;
}

/* Per-indicator row with brain-cited threshold context */
function indicatorRow(key, val){
  const meta = IND[key];
  if(!meta) return `<div class="ind"><span class="lbl mono">${esc(key)}</span><span class="val">${fmtVal(val)}</span><span class="ctx"></span></div>`;
  return `<div class="ind" title="${esc(meta.desc)}">
    <div><span class="lbl">${esc(meta.label)}</span> <span class="dim2 mono" style="font-size:10px">[${esc(meta.brain)}]</span></div>
    <span class="val">${fmtVal(val)}${esc(meta.unit)}</span>
    <span class="ctx">good ${esc(meta.good)} · bad ${esc(meta.bad)}</span>
  </div>`;
}

/* Leg card renderer */
function legCard(name, l){
  const s = l.score ?? 0;
  const f = l.score_fused;
  const sCls = s<0?'leg-neg':(s>0?'leg-pos':'leg-zero');
  const fCls = f==null?'leg-zero':f<0?'leg-neg':f>0?'leg-pos':'leg-zero';

  // Extract numeric indicators (not meta fields)
  const meta = new Set(['score','why','fleet_inputs','fleet_adj','score_fused','advisory','cite']);
  const inds = Object.entries(l).filter(([k])=>!meta.has(k));
  const indHtml = inds.length ? inds.map(([k,v])=>indicatorRow(k,v)).join('') : '<div class="dim2" style="font-size:11px;padding:6px 0">no direct indicators</div>';

  const whys = (l.why||[]);
  const whyHtml = whys.length ? whys.map(w=>`<div class="rule">${esc(w)}</div>`).join('') : '';

  const fis = (l.fleet_inputs||[]);
  const fiHtml = fis.length ? `<div style="margin-top:8px"><div class="dim" style="font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Fleet Inputs (${fis.length})</div>${fis.map(fleetInputRow).join('')}</div>` : '';

  const advisoryTag = l.advisory ? ' <span class="pill" style="background:#2a2a14;color:var(--amber)">ADVISORY</span>' : '';
  const citeTag = l.cite ? ` <span class="dim2 mono" style="font-size:10px">cite: ${esc(l.cite)}</span>` : '';

  return `<div class="card">
    <div class="leg-header">
      <div>
        <div class="leg-name">${esc(name.toUpperCase())}${advisoryTag}</div>
        ${citeTag}
      </div>
      <div class="leg-score-block">
        <div class="raw">raw <span class="${sCls}">${fmt(s,1)}</span> ${l.fleet_adj!=null?`· fleet ${fmt(l.fleet_adj,2)}`:''}</div>
        <div class="fused ${fCls}">${f!=null?fmt(f,2):fmt(s,2)}</div>
      </div>
    </div>
    ${gauge(s, f)}
    <div style="margin-top:8px">${indHtml}</div>
    ${whyHtml ? `<div style="margin-top:8px">${whyHtml}</div>` : ''}
    ${fiHtml}
  </div>`;
}

/* SVG: recent posture timeline as a proper composite chart */
function timelineChart(tl){
  if(!tl || !tl.length) return '<div class="dim">no timeline data</div>';
  const W=1200,H=120,PL=42,PR=12,PT=8,PB=22;
  const w=W-PL-PR, h=H-PT-PB;
  const n=tl.length;
  const vs=tl.map(t=>t.composite);
  const mn=Math.min(...vs, -1.5), mx=Math.max(...vs, 1.5);
  const rg=mx-mn;
  const X=i=>PL + (i/(n-1))*w;
  const Y=v=>PT + h - ((v-mn)/rg)*h;
  const zeroY=Y(0);
  // Posture-colored bars
  const bars = tl.map((t,i)=>{
    const color = t.posture==='RISK_ON'?'#6fce8a':t.posture==='NEUTRAL'?'#F0B429':t.posture==='SEVERE'?'#8a1e0e':'#E07A6A';
    const xL = X(i)-((w/(n-1))*0.4);
    const xR = X(i)+((w/(n-1))*0.4);
    const y0 = Math.min(Y(t.composite), zeroY);
    const y1 = Math.max(Y(t.composite), zeroY);
    return `<rect x="${xL.toFixed(1)}" y="${y0.toFixed(1)}" width="${(xR-xL).toFixed(1)}" height="${(y1-y0).toFixed(1)}" fill="${color}" opacity="0.85"><title>${esc(t.date)}: ${esc(t.posture)} composite ${fmt(t.composite,2)}</title></rect>`;
  }).join('');
  // Y-axis
  let yaxis='';
  for(let i=0;i<=4;i++){
    const v=mn+rg*i/4, py=Y(v);
    yaxis += `<line x1="${PL}" y1="${py.toFixed(1)}" x2="${PL+w}" y2="${py.toFixed(1)}" stroke="#1a2029" stroke-width="0.5"/><text x="${PL-6}" y="${(py+3).toFixed(1)}" fill="#6b7480" font-size="10" text-anchor="end" font-family="ui-monospace,monospace">${fmt(v,1)}</text>`;
  }
  // Zero line
  yaxis += `<line x1="${PL}" y1="${zeroY.toFixed(1)}" x2="${PL+w}" y2="${zeroY.toFixed(1)}" class="zero-line"/>`;
  // X labels (first, middle, last)
  const xlbl = [0, Math.floor(n/2), n-1].map(i=>{
    const d=String(tl[i].date).slice(5); // MM-DD
    return `<text x="${X(i).toFixed(1)}" y="${H-6}" fill="#6b7480" font-size="10" text-anchor="middle" font-family="ui-monospace,monospace">${esc(d)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:130px">${yaxis}${bars}${xlbl}</svg>
    <div class="legend">
      <span><span class="sw" style="background:#6fce8a"></span>RISK_ON</span>
      <span><span class="sw" style="background:#F0B429"></span>NEUTRAL</span>
      <span><span class="sw" style="background:#E07A6A"></span>RISK_OFF</span>
      <span><span class="sw" style="background:#8a1e0e"></span>SEVERE</span>
      <span class="dim2">${n} days · ${tl[0].date} → ${tl[n-1].date}</span>
    </div>`;
}

/* SVG: event-study flip results — SPX fwd 21d & 63d visualization */
function flipsChart(flips){
  if(!flips || !flips.length) return '<div class="dim">no flip events</div>';
  const rows = flips.map(f=>{
    const p21 = f.spx_fwd_21d_pct;
    const p63 = f.spx_fwd_63d_pct;
    const max = 8; // % scale
    const barPos = v=>{
      if(v==null) return '<span class="dim2">n/a</span>';
      const w = Math.min(Math.abs(v)/max*50, 50);
      const cls = v>=0 ? 'esbar-pos' : 'esbar-neg';
      return `<div class="esbar-wrap"><div class="eszero"></div><div class="esbar ${cls}" style="width:${w.toFixed(1)}%"></div></div>`;
    };
    return `<div class="esrow">
      <span class="mono dim">${esc(f.date)}</span>
      <span><span class="badge p-${esc(f.posture)}">${esc(f.posture)}</span></span>
      ${barPos(p21)}
      <span class="mono ${p21==null?'dim':(p21<0?'leg-neg':'leg-pos')}" style="text-align:right">${p21==null?'—':fmt(p21,2)+'%'}</span>
    </div>`;
  }).join('');
  return `<div class="esrow" style="border-bottom:1px solid var(--line);color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px">
    <span>FLIP DATE</span><span>POSTURE</span><span>SPX 21D FWD →</span><span style="text-align:right">21D %</span>
  </div>${rows}
  <div class="dim2" style="font-size:11px;margin-top:6px">Bars centered at zero. Green = gate was right (avoided loss / caught upside). Red = SPX rallied while gate was off — cost of caution.</div>`;
}

/* series-to-note enriched table */
function seriesTable(s2n){
  const rows = Object.entries(s2n||{}).map(([code, note])=>{
    const desc = SERIES_DESC[code] || '<span class="dim2">(no local description)</span>';
    return `<tr class="s2n-row">
      <td><span class="s2n-code">${esc(code)}</span></td>
      <td><span class="s2n-desc">${desc}</span></td>
      <td class="s2n-note">${esc(note)}</td>
    </tr>`;
  }).join('');
  return `<table>
    <tr><th>Series</th><th>What it measures</th><th>Brain note</th></tr>
    ${rows}
  </table>`;
}

async function load(){
  let d=null,srcUrl=null;
  for(const u of SRC){
    try{
      const r=await fetch(u+'?v='+Date.now());
      if(r.ok){ d=await r.json(); srcUrl=u; break; }
    }catch(e){}
  }
  if(!d){document.getElementById('root').innerHTML='<div class="card" style="border-color:var(--red)"><b class="leg-neg">Feed unreachable.</b><div class="dim" style="margin-top:4px">Both primary and fallback feeds failed. Check justhodl.ai/data/risk-gate.json and s3 mirror.</div></div>';return}
  render(d, srcUrl);
}

function render(d, srcUrl){
  const es = d.event_study || {};
  const oc = es.october_2025_replay || {};
  const bc = d.brain_constitution || {};
  const fc = d.fleet_context || {};
  const legs = d.legs || {};
  const ageH = ageHours(d.generated_at);
  const ageStr = ageLabel(ageH);
  const ageCls = ageH==null?'age-old':ageH<6?'fresh':ageH<24?'stale':'old';

  // Posture summary
  const postureBadge = `<span class="badge p-${esc(d.posture)}" style="font-size:22px;padding:6px 16px">${esc(d.posture)}</span>`;

  // Replay-only info
  const replayNote = (d.replay_posture_fred_only && d.replay_posture_fred_only !== d.posture)
    ? `<div class="dim" style="font-size:11px;margin-top:4px">FRED-only replay: <b class="mono">${esc(d.replay_posture_fred_only)}</b> composite ${fmt(d.replay_composite_fred_only,2)}</div>`
    : `<div class="dim2" style="font-size:11px;margin-top:4px">FRED-only replay confirms: ${fmt(d.replay_composite_fred_only,2)}</div>`;

  // Fleet context — handle null crisis_composite explicitly
  const crisisComp = fc.crisis_composite;
  const crisisDisplay = crisisComp==null
    ? '<span class="dim2">not computed</span>'
    : `<span class="mono">${fmt(crisisComp)}</span>`;

  // Age banner
  const ageBanner = `<div class="age-banner ${ageCls}">
    <div>
      <b>Feed age: <span class="mono">${esc(ageStr)}</span></b>
      <span class="dim" style="margin-left:8px">generated ${esc((d.generated_at||'').slice(0,19))}Z · engine took ${fmt(d.elapsed_s,1)}s</span>
    </div>
    <div class="dim2 mono" style="font-size:11px">source: ${esc((srcUrl||'').replace('https://',''))}</div>
  </div>`;

  document.getElementById('root').outerHTML = `
${ageBanner}
<div class="summary">
  <div class="card">
    <div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">Master Posture</div>
    <div style="margin:8px 0">${postureBadge}</div>
    <div class="mono" style="font-size:16px">composite <b>${fmt(d.composite,2)}</b></div>
    ${replayNote}
  </div>
  <div class="card">
    <div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">Sizing Multiplier</div>
    <div class="big mono" style="color:var(--amber);margin:4px 0">×${fmt(d.sizing_multiplier)}</div>
    <div class="dim" style="font-size:11px">${esc(d.consume_as||'')}</div>
  </div>
  <div class="card">
    <div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">Fleet Context</div>
    <div style="font-size:12px;margin-top:6px"><b class="dim">yen-carry:</b> ${fmt(fc.yen_carry_composite)}</div>
    <div style="font-size:12px;margin-top:4px"><b class="dim">crisis-composite:</b> ${crisisDisplay}</div>
    <div class="dim2 mono" style="font-size:10px;margin-top:8px">v${esc(d.version)} · ${esc(d.engine)} · ${esc(d.marker||'')}</div>
  </div>
</div>

<div class="action-strip">
  <span class="lbl">Playbook</span>
  <div class="body">${esc(d.consume_as||'')}</div>
</div>

<h2>Seven Legs — Brain-Cited Score Cards</h2>
<div class="dim" style="font-size:12px;margin-bottom:8px">Each leg scored −2..+2. White tick = raw score. Amber tick = fused score (with fleet inputs applied). Score bands: risk-off (red) → neutral (amber) → risk-on (green).</div>
<div class="grid-legs">${Object.entries(legs).map(([n,l])=>legCard(n,l)).join('')}</div>

<h2>Recent Posture Timeline (~90 trading days)</h2>
<div class="card">
  ${timelineChart(d.recent_timeline)}
</div>

<h2>Event Study — Was the Gate Right?</h2>
<div class="card">
  <div style="font-size:12.5px">${esc(es.methodology||'')}</div>
  <div style="margin:10px 0;display:flex;gap:16px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:13px">
    <div><span class="dim">Flips to risk-off:</span> <b>${fmt(es.n_flips_to_risk_off_or_worse,0)}</b></div>
    <div><span class="dim">SPX fwd-21d baseline:</span> <b>${fmt(es.spx_baseline_fwd_21d_pct)}%</b></div>
    <div><span class="dim">While risk-off:</span> <b class="${es.avg_spx_fwd_21d_while_risk_off_pct > es.spx_baseline_fwd_21d_pct ? 'leg-neg':'leg-pos'}">${fmt(es.avg_spx_fwd_21d_while_risk_off_pct)}%</b></div>
    <div class="dim2">${es.avg_spx_fwd_21d_while_risk_off_pct > es.spx_baseline_fwd_21d_pct ? '⚠ gate hurt returns' : '✓ gate added value'}</div>
  </div>
  <div class="dim" style="font-size:12px">${esc(es.gate_adds_value_if||'')}</div>
  <div style="margin-top:10px">${flipsChart(es.flips)}</div>
</div>

<h2>October 2025 Replay — Khalid's Historical Call</h2>
<div class="card">
  <div style="font-family:ui-monospace,monospace;font-size:13px">
    <b>Window:</b> ${esc(oc.window)} ·
    <b>RRP min:</b> <span style="color:var(--amber)">$${fmt(oc.rrp_min_in_window_bn)}B</span>
  </div>
  <div style="margin:8px 0;display:flex;gap:12px;flex-wrap:wrap;font-size:13px">
    ${Object.entries(oc.posture_day_counts||{}).map(([k,v])=>`<div><span class="badge p-${esc(k)}">${esc(k)}</span> <b class="mono">${v}</b> days</div>`).join('')}
  </div>
  <div class="rule" style="border-left-color:var(--amber);font-size:12.5px">${esc(oc.khalid_call||'')}</div>
</div>

<h2>Brain Constitution — Directive & Series Registry</h2>
<div class="card">
  <div class="rule">${esc(bc.directive||'')}</div>
  <div class="dim" style="font-size:12px;margin:8px 0"><b>Hierarchy:</b> ${esc(bc.hierarchy||'')}</div>
  <div style="margin-top:10px">${seriesTable(bc.series_to_note)}</div>
</div>

<div style="margin-top:16px;padding:12px;background:var(--card2);border-radius:8px;font-size:11px;color:var(--dim2);text-align:center">
  Every rule cites a Khalid brain note. Every input is validated. Feed refreshes every ~5 minutes.
  Source: <span class="mono">${esc(srcUrl||'')}</span>
</div>
`;
}

load();
</script></body></html>
