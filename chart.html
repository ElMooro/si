#cmdk.on{display:flex}
#cmdk .box{width:min(560px,94vw);background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 16px 48px rgba(19,23,34,.18)}
#cmdk input{width:100%;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);outline:none;font-family:"IBM Plex Sans",sans-serif;background:var(--bg);color:var(--fg)}
#cmdk .res{max-height:360px;overflow:auto}
#cmdk .res button{display:flex;justify-content:space-between;width:100%;padding:9px 16px;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:left}
#cmdk .res button:hover,#cmdk .res button.on{background:var(--chip)}
#cmdk .res button span{color:var(--mut)}
#props{position:absolute;top:40px;left:52px;z-index:6;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:200px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:none}
#props.on{display:block}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sw i{width:16px;height:16px;border-radius:50%;display:block;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:var(--fg)}
#typeq{display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:46;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:min(420px,92vw);max-height:50vh;overflow:auto;box-shadow:0 12px 32px rgba(19,23,34,.14);font-family:"IBM Plex Mono",monospace;font-size:12px}
#typeq.on{display:block}
#typeq .lab{padding:8px 14px;font-size:10px;letter-spacing:1px;color:var(--mut)}
#typeq button{display:flex;justify-content:space-between;width:100%;padding:8px 14px;text-align:left}
#typeq button:hover{background:var(--chip)}
#typeq button span{color:var(--mut)}
.heatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0}
.hcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:4px}
.hcell span{opacity:.9;font-size:9px}
.srow{display:grid;grid-template-columns:1fr 54px 48px 40px 48px;gap:4px;padding:4px 0;border-bottom:1px solid var(--chip);align-items:center;width:100%;text-align:left;font-size:11px}
.srow span:nth-child(n+2){text-align:right}
.sbar{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sbar button{padding:3px 8px;border:1px solid var(--line);border-radius:99px;font-size:10px;color:var(--mut)}
.sbar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tbtn{padding:6px 14px;border-radius:4px;font-weight:600;font-size:12px}
.tbtn.buyx{background:var(--up);color:#fff}.tbtn.sellx{background:var(--dn);color:#fff}
.tqty{width:72px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:"IBM Plex Mono",monospace}
.kgrid{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:11px}
.kgrid span:nth-child(odd){color:var(--acc);font-family:"IBM Plex Mono",monospace}
.season{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.scell{padding:8px 4px;border-radius:4px;text-align:center}
.corm{display:grid;gap:2px;margin-top:8px;font-size:9px}
#dock{flex:none;border-top:1px solid var(--line);background:var(--raised)}
#dock .dtabs{display:flex;height:28px;align-items:stretch;font-family:"IBM Plex Mono",monospace;font-size:11px;overflow-x:auto}
#dock .dtabs button{padding:0 12px;color:var(--mut);white-space:nowrap}
#dock .dtabs button.on{color:var(--acc);background:var(--bg);border-top:2px solid var(--acc)}
#dockbody{display:none;max-height:220px;overflow:auto;background:var(--bg);padding:10px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px}
#dock.on #dockbody{display:block}
#listfab{display:none;position:fixed;bottom:36px;right:10px;z-index:20;background:var(--acc);color:#fff;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:600;box-shadow:0 6px 18px rgba(41,98,255,.35)}
#app.chart-only .watch{display:none}
#app.chart-only .rail{width:0;overflow:hidden;border:0;padding:0}
@media(max-width:720px){
  .watch{position:absolute;inset:36px 0 26px 0;z-index:8;width:100%;max-width:none;box-shadow:0 0 0 1px var(--line)}
  .watch.hide{display:none!important}
  .rail{display:none}
  #stage.split2,#stage.split4{grid-template-columns:1fr;grid-template-rows:1fr}
  .pane:nth-child(n+2){display:none!important}
  .heatgrid{grid-template-columns:repeat(3,1fr)}
  #dock,#mini,#symin{display:none!important}
  #dwin,#dwin.on{display:none!important}
  #listfab{display:block}
  #legend{max-width:70%}
  #wm{font-size:36px}
}
/* Supercharts chrome — first paint, not a delayed overlay */
#tfbar{height:38px;padding:0 8px;gap:2px;background:#131722}
#tfbar button{height:28px;padding:0 8px;font-size:13px;border-radius:4px}
.tabs{height:38px;background:#1e222d}
.rail{width:52px;background:#1e222d}
.watch,#watch{width:var(--watch-w,320px);min-width:180px;max-width:none}
.jh-tv-trade{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding-left:12px}
#quote .sell,#tfbar .sell,.jh-tv-sell{background:#f23645;color:#fff;font-weight:700;padding:5px 12px;border-radius:4px;font-size:12px;letter-spacing:.02em}
#quote .buy,#tfbar .buy,.jh-tv-buy{background:#2962ff;color:#fff;font-weight:700;padding:5px 12px;border-radius:4px;font-size:12px;letter-spacing:.02em}
html[data-theme=dark] #quote .sell,html[data-theme=dark] #tfbar .sell{background:#f23645;color:#fff}
html[data-theme=dark] #quote .buy,html[data-theme=dark] #tfbar .buy{background:#2962ff;color:#fff}
#dock .dtabs{height:32px}
#dock .dtabs button{padding:0 14px;font-size:12px}
#dock .dtabs button.on{color:#2962ff;border-top:0;border-bottom:2px solid #2962ff;background:transparent}
#tape,#listfab,#chgbar,#quote,#desk-intel,#intel,#paste,.filt:has(#paste){display:none!important}
#watch{overflow:hidden;position:relative;display:flex;flex-direction:column}
#w-list{flex:none;height:var(--list-h,240px);min-height:96px;overflow:hidden;display:flex;flex-direction:column}
#detail,#detail.tvcard{display:block;flex:none;min-height:0;overflow:visible;border-top:0}
#wlist{flex:1;overflow:auto;min-height:0}
#w-stack{flex:1;min-height:140px;overflow:auto}
#wd-split{height:8px;cursor:ns-resize;flex:none}
.w-split{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:14}
#rrail{flex:none;width:40px;background:#1e222d;border-left:1px solid #2a2e39;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;z-index:24}
#rrail button{width:32px;height:32px;border-radius:4px;color:#787b86}
#watch .wtitle{display:flex;align-items:center;height:36px;padding:0 8px 0 12px;border-bottom:1px solid #2a2e39;flex:none}
#watch .wtitle b{flex:1;font-size:13px;font-weight:600}
#wtabs{display:none}
#tv-zoom{position:absolute;right:8px;bottom:30px;z-index:8;display:flex;flex-direction:column;border:1px solid #2a2e39;border-radius:4px;overflow:hidden;background:#1e222d;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#tv-zoom button{width:28px;height:28px;border-radius:0;background:#1e222d;border:0;border-bottom:1px solid #2a2e39;color:#d1d4dc;font-size:18px;line-height:26px;font-weight:500}
#tv-zoom button:last-child{border-bottom:0}
#tfbar .wsico{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#787b86}
#tfbar .wsico:hover{background:#2a2e39;color:#d1d4dc}
#tfbar .chg{height:26px;padding:0 7px;font-size:11px;color:#787b86}
#tfbar .chg.on{background:#7c5cea;color:#fff}
#watch.is-collapsed{width:0!important;min-width:0!important;max-width:0!important;border:0;overflow:hidden}
#watch.is-open{width:var(--watch-w,320px)!important;min-width:220px!important}
@media(max-width:720px){ #listfab{display:none!important} }
</style>
</head>
<body>
<div id="app" data-engine="justhodl-chart" data-output="data/jh-internals.json" data-jh-sections="off">
  <div class="tabs" id="tabs"></div>
  <div class="bar" id="tfbar"></div>
  <div id="favs"></div>
  <div class="bar" id="chgbar"></div>
  <div class="row">
    <div class="rail" id="rail"></div>
    <div class="main">
      <div class="quote" id="quote"></div>
      <div id="tape"></div>
      <div id="stage">
        <div class="pane" id="chart">
          <div class="host" id="host"></div>
          <div id="wm"></div>
          <canvas id="vp"></canvas>
          <svg id="draw"></svg>
          <div id="legend"></div>
          <div id="hud"></div>
          <div id="dwin"></div>
          <div id="ohlc"></div>
          <div id="obj"></div>
          <div id="props"></div>
          <div id="tv-zoom"><button type="button" id="z-plus" title="Zoom in">+</button><button type="button" id="z-minus" title="Zoom out">−</button></div>
        </div>
        <div class="pane" id="chart2" style="display:none"><div class="host" id="host2"></div></div>
        <div class="pane" id="chart3" style="display:none"><div class="host" id="host3"></div></div>
        <div class="pane" id="chart4" style="display:none"><div class="host" id="host4"></div></div>
      </div>
      <div id="oscwrap"></div>
      <div id="mini"></div>
      <div id="replay">
        <button id="rp-play">Play</button>
        <button id="rp-step">Step</button>
        <button id="rp-back">−1</button>
        <select id="rp-speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="20">20x</option></select>
        <input id="rp-scrub" type="range" min="10" max="100" value="80">
        <input id="rp-date" type="date">
        <span id="rp-label"></span>
        <button id="rp-exit">Exit replay</button>
      </div>
    </div>
    <aside class="watch is-collapsed" id="watch">
      <div class="w-split" id="w-split" title="Drag to resize watchlist"></div>
      <div class="wtitle"><b>Watchlist</b>
        <div class="wops">
          <button type="button" id="w-searchbtn" title="Search symbol">⌕</button>
          <button type="button" id="w-chartm" title="Chart / company info">◆</button>
          <button type="button" id="w-pin" title="Pin watchlist">📌</button>
          <button type="button" id="w-close" title="Close">×</button>
        </div>
      </div>
      <div class="whead">
        <select id="list"></select>
        <span id="nlists" style="font-size:10px;color:var(--mut)"></span>
        <div class="wops">
          <button type="button" id="w-new" title="New list">+</button>
          <button type="button" id="w-menu" title="List menu">⋮</button>
        </div>
      </div>
      <div class="wsub" id="wsub"></div>
      <div class="wtabs" id="wtabs"></div>
      <div id="w-list">
        <div class="letters" id="letters"></div>
        <div class="filt"><input id="q" placeholder="Search"></div>
        <div class="filt"><input id="paste" placeholder="Paste NVDA,AAPL,FRED:DGS10 — new list"></div>
        <div id="hits"></div>
        <div class="cols" id="cols"><span></span><span data-s="sym">Symbol</span><span data-s="last">Last</span><span data-s="chgv">Chg</span><span data-s="chg">Chg%</span></div>
        <div id="wlist"></div>
        <button type="button" class="addsym" id="addsym">+ Add symbol</button>
      </div>
      <div id="wd-split" title="Drag to resize list / details"></div>
      <div id="w-stack">
        <div class="detail tvcard" id="detail"></div>
        <div id="fin"></div>
        <div id="over"></div>
        <div id="tech"></div>
        <div id="season"></div>
        <div id="notes"></div>
        <div id="alerts"></div>
        <div id="cal"></div>
        <div id="news"></div>
        <div id="heat"></div>
        <div id="screen"></div>
        <div id="trade"></div>
        <div id="test"></div>
        <div id="corr"></div>
        <div id="qr"></div>
      </div>
      <div id="intel"></div>
      <div id="desk-intel" style="display:none"></div>
    </aside>
    <aside id="rrail" aria-label="Panels">
      <button type="button" data-rail="watch" title="Watchlist">☰</button>
      <button type="button" data-rail="details" title="Symbol details">◆</button>
      <button type="button" data-rail="news" title="News">N</button>
      <button type="button" data-rail="alerts" title="Alerts">🔔</button>
    </aside>
  </div>
  <div id="dock">
    <div class="dtabs" id="dtabs"></div>
    <div id="dockbody"></div>
  </div>
  <div class="foot"><span id="clock"></span><span id="tzlab">UTC</span><span id="cd">v12 QR</span><span id="livepill"><i></i> LIVE</span><span id="stat"></span><span style="margin-left:auto"><button id="btn-keys">Hotkeys</button> · <a href="/chart-pro.html">Chart Pro</a> · / search · click ticker · Ctrl+K</span></div>
</div>
<button id="listfab">List</button>
<div id="fly"></div>
<div id="menu" class="menu"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="cmdk"><div class="box"><input id="cmdin" placeholder="Search symbols, notes, financials, indicators…"><div class="res" id="cmdres"></div></div></div>
<div id="typeq"></div>
<div id="symsearch"><div class="sbox"><input id="ssin" placeholder="Search ticker, company, or overlay a compare symbol" autocomplete="off"><div class="sschips" id="sschips"></div><div id="ssres"></div></div></div>
<div id="ctx"></div>
<div id="toast"></div>
<script src="/jh-chart-vol-events.js?v=2"></script>
<script src="/jh-chart-tape.js?v=3"></script>
<script src="/jh-chart-rs.js?v=1"></script>
<script src="/jh-chart-macro-intel.js?v=1"></script>
<script src="/jh-chart-ai-desk.js?v=1"></script>
<script src="/jh-chart-vwap.js?v=1"></script>
<script src="/jh-chart-rail.js?v=1"></script>
<script src="/jh-chart-dock.js?v=1"></script>
<script src="/jh-chart-studio.js?v=4"></script>
<script src="/jh-chart-tvrail.js?v=2"></script>
<script src="/jh-chart-engine.js?v=13"></script>
<script src="/jh-chart-tvux.js?v=2"></script>
<script src="/jh-chart-indux.js?v=2"></script>
<script src="/jh-chart-stock-desk.js?v=1"></script>
<script src="/jh-chart-quality.js?v=1"></script>
</body>
</html>
