<!DOCTYPE html>
<html lang="en" data-jh-sections="off">
<head>
<meta charset="utf-8">
<!-- jh-reskin-skip: tradingview-native light terminal; Chart Pro is the safety net -->
<title>Chart · JustHodl.AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://justhodl.ai/chart.html">
<meta name="jh-engine" content="justhodl-chart">
<meta name="jh-output" content="data/jh-internals.json">
<meta name="jh-chrome" content="off">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#fff;--raised:#f8f9fd;--chip:#eef0f6;--fg:#131722;--mut:#6a6d78;--line:#e0e3eb;--up:#089981;--dn:#f23645;--acc:#2962ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fff;color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button,select,input,textarea{background:none;border:0;color:inherit;font:inherit}button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.tabs{display:flex;height:36px;border-bottom:1px solid var(--line);background:var(--raised);overflow-x:auto;align-items:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut);white-space:nowrap;height:36px}
.tab.on{background:#fff;color:var(--fg)}.up{color:var(--up)}.dn{color:var(--dn)}
.tab.brand{font-weight:600;color:var(--acc)}
.tab.pro{margin-left:auto}
.bar{display:flex;align-items:center;gap:2px;height:34px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;flex-wrap:nowrap}
.bar button,.bar label{padding:4px 7px;border-radius:4px;color:var(--mut);white-space:nowrap}
.bar button.on,.rail button.on,.gbtn.on{background:var(--chip);color:var(--acc)}
.bar input[type=date],.bar input[type=text],.bar input[type=number]{border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px;min-width:90px}
.row{display:flex;flex:1;min-height:0}
.rail{width:44px;border-right:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:1px;overflow-y:auto;position:relative;z-index:7}
.rail .gbtn{width:34px;height:28px;border-radius:4px;color:var(--mut);font-size:11px;position:relative}
.rail .sep{height:1px;background:var(--line);width:24px;margin:4px 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.quote{display:flex;gap:10px;align-items:center;height:30px;padding:0 12px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;overflow-x:auto}
#stage{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:1fr;min-height:0;position:relative;background:#fff}
#stage.split2{grid-template-columns:1fr 1fr}
#stage.split4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pane{position:relative;min-height:0;min-width:0;background:#fff;overflow:hidden;height:100%}
.pane + .pane{border-left:1px solid var(--line)}
#stage.split4 .pane:nth-child(3),#stage.split4 .pane:nth-child(4){border-top:1px solid var(--line);border-left:1px solid var(--line)}
#stage.split4 .pane:nth-child(3){border-left:0}
.host{position:absolute;inset:0;width:100%;height:100%}
#oscwrap{height:132px;border-top:1px solid var(--line);position:relative;display:none;background:#fff}
#oscwrap.on{display:block}
#osc{position:absolute;inset:0}
#legend{position:absolute;left:12px;top:8px;z-index:4;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut);pointer-events:none;max-width:300px}
#legend button{pointer-events:auto;display:block;text-align:left;padding:1px 0}
#hud{position:absolute;right:72px;top:8px;z-index:5;font-family:"IBM Plex Mono",monospace;font-size:11px;background:rgba(255,255,255,.92);padding:4px 8px;border:1px solid var(--line);border-radius:4px;display:none}
#draw{position:absolute;inset:0;z-index:3;pointer-events:none}
#vp{position:absolute;left:0;top:0;bottom:26px;width:80px;z-index:2;pointer-events:none}
#wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:600;color:rgba(19,23,34,.06);pointer-events:none;z-index:1;font-family:"IBM Plex Sans",sans-serif}
.watch{width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-width:280px}
.watch.hide{display:none}
.whead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.whead select{flex:1;min-width:0;font-weight:500;font-size:12px}
.wtabs{display:flex;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px}
.wtabs button{flex:1;padding:6px;color:var(--mut)}.wtabs button.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.letters{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.letters button{width:18px;height:18px;border-radius:50%;font-size:9px;font-family:"IBM Plex Mono",monospace;color:var(--mut)}
.letters button.on{background:var(--acc);color:#fff}
.filt{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.filt input{flex:1;font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none}
.cols{display:grid;grid-template-columns:16px 1fr 58px 48px 48px 44px 40px;padding:4px 10px;font-size:10px;color:var(--mut);font-family:"IBM Plex Mono",monospace;border-bottom:1px solid var(--line)}
.cols span{cursor:pointer}
#wlist{flex:1;overflow:auto;min-height:80px}
.wrow{display:grid;grid-template-columns:16px 1fr 58px 48px 48px 44px 40px;width:100%;padding:4px 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:left;align-items:center}
.wrow:hover,.wrow.on{background:var(--chip)}.wrow span:nth-child(n+3){text-align:right}
.flag{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.spark{width:40px;height:16px}
#hits{max-height:120px;overflow:auto;border-bottom:1px solid var(--line)}
.hit{display:flex;justify-content:space-between;width:100%;padding:4px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.hit span:last-child{color:var(--mut);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{border-top:1px solid var(--line);padding:10px 14px;font-size:12px}
.detail .px{font-size:22px;font-weight:500;font-family:"IBM Plex Mono",monospace;margin-top:4px}
.rg{height:6px;background:var(--chip);border-radius:99px;margin:6px 0 4px;position:relative}
.rg i{position:absolute;inset:0 auto 0 0;background:var(--up);border-radius:99px}.rg b{position:absolute;top:-2px;width:8px;height:10px;background:var(--fg);border-radius:2px}
#intel,#news,#alerts,#tech,#cal,#notes,#heat{border-top:1px solid var(--line);padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;max-height:220px;overflow:auto}
#intel b,#news b,#alerts b,#tech b,#cal b,#notes b,#heat b{letter-spacing:1px;color:var(--acc);font-size:10px}
.cell{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--chip)}
.nitem{display:block;padding:6px 0;border-bottom:1px solid var(--chip);color:var(--fg);text-align:left}
.nitem span{display:block;color:var(--mut);font-size:10px}
.gauge{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--chip)}
.gauge .bar{flex:1;height:6px;background:linear-gradient(90deg,var(--dn),#ffb74d,var(--up));border-radius:99px;position:relative;padding:0}
.gauge .bar i{position:absolute;top:-3px;width:4px;height:12px;background:var(--fg);border-radius:2px}
.buy{background:#e6f6f2;color:var(--up);padding:2px 8px;border-radius:4px}.sell{background:#fde8ea;color:var(--dn);padding:2px 8px;border-radius:4px}
.neut{background:var(--chip);color:var(--mut);padding:2px 8px;border-radius:4px}
.foot{height:26px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mut);background:var(--raised);gap:12px}
.foot a{color:var(--acc)}
#replay{display:none;align-items:center;gap:8px;height:36px;padding:0 10px;border-top:1px solid var(--line);background:var(--raised);font-family:"IBM Plex Mono",monospace;font-size:11px}
#replay.on{display:flex}
#replay input[type=range]{flex:1}
#modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(19,23,34,.35);align-items:flex-start;justify-content:center;padding-top:8vh}
#modal.on{display:flex}
#modal .box{width:min(560px,94vw);max-height:80vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
#modal h3{margin:0 0 10px;font-size:14px}
.indrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--chip);font-family:"IBM Plex Mono",monospace;font-size:12px}
.icat{font-size:10px;letter-spacing:1px;color:var(--acc);margin:10px 0 4px}
#ctx{display:none;position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:6px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.08);font-family:"IBM Plex Mono",monospace;font-size:12px}
#ctx button{display:block;width:100%;text-align:left;padding:8px 12px}
#ctx button:hover{background:var(--chip)}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#131722;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;z-index:60;display:none}
#toast.on{display:block}
#obj{position:absolute;bottom:8px;left:48px;z-index:6;width:240px;max-height:200px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:none}
#obj.on{display:block}
#fly{display:none;position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(19,23,34,.12);min-width:190px;max-height:70vh;overflow:auto;padding:6px 0;font-family:"IBM Plex Mono",monospace;font-size:12px}
#fly.on{display:block}
#fly button{display:block;width:100%;text-align:left;padding:7px 14px;color:var(--fg)}
#fly button:hover,#fly button.on{background:var(--chip);color:var(--acc)}
#fly .lab{padding:6px 14px;font-size:10px;letter-spacing:1px;color:var(--mut)}
#cmdk{display:none;position:fixed;inset:0;z-index:45;background:rgba(19,23,34,.28);align-items:flex-start;justify-content:center;padding-top:12vh}
#cmdk.on{display:flex}
#cmdk .box{width:min(560px,94vw);background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 16px 48px rgba(19,23,34,.18)}
#cmdk input{width:100%;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);outline:none;font-family:"IBM Plex Sans",sans-serif}
#cmdk .res{max-height:360px;overflow:auto}
#cmdk .res button{display:flex;justify-content:space-between;width:100%;padding:9px 16px;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:left}
#cmdk .res button:hover,#cmdk .res button.on{background:var(--chip)}
#cmdk .res button span{color:var(--mut)}
#props{position:absolute;top:40px;left:52px;z-index:6;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;width:200px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:none}
#props.on{display:block}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sw i{width:16px;height:16px;border-radius:50%;display:block;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#131722}
#typeq{display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:46;background:#fff;border:1px solid var(--line);border-radius:8px;min-width:min(420px,92vw);max-height:50vh;overflow:auto;box-shadow:0 12px 32px rgba(19,23,34,.14);font-family:"IBM Plex Mono",monospace;font-size:12px}
#typeq.on{display:block}
#typeq .lab{padding:8px 14px;font-size:10px;letter-spacing:1px;color:var(--mut)}
#typeq button{display:flex;justify-content:space-between;width:100%;padding:8px 14px;text-align:left}
#typeq button:hover{background:var(--chip)}
#typeq button span{color:var(--mut)}
.heatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0}
.hcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:4px}
.hcell span{opacity:.9;font-size:9px}
#app.chart-only .watch{display:none}
#app.chart-only .rail{width:0;overflow:hidden;border:0;padding:0}
@media(max-width:720px){.watch{position:absolute;inset:36px 0 26px auto;z-index:8;width:min(100%,360px);box-shadow:0 0 0 1px var(--line)}.rail{display:none}#stage.split2,#stage.split4{grid-template-columns:1fr;grid-template-rows:1fr}.pane:nth-child(n+2){display:none!important}.heatgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app" data-engine="justhodl-chart" data-output="data/jh-internals.json" data-jh-sections="off">
  <div class="tabs" id="tabs"></div>
  <div class="bar" id="tfbar"></div>
  <div class="bar" id="chgbar"></div>
  <div class="row">
    <div class="rail" id="rail"></div>
    <div class="main">
      <div class="quote" id="quote"></div>
      <div id="stage">
        <div class="pane" id="chart">
          <div class="host" id="host"></div>
          <div id="wm"></div>
          <canvas id="vp"></canvas>
          <svg id="draw"></svg>
          <div id="legend"></div>
          <div id="hud"></div>
          <div id="obj"></div>
          <div id="props"></div>
        </div>
        <div class="pane" id="chart2" style="display:none"><div class="host" id="host2"></div></div>
        <div class="pane" id="chart3" style="display:none"><div class="host" id="host3"></div></div>
        <div class="pane" id="chart4" style="display:none"><div class="host" id="host4"></div></div>
      </div>
      <div id="oscwrap"><div id="osc"></div></div>
      <div id="replay">
        <button id="rp-play">Play</button>
        <button id="rp-step">Step</button>
        <button id="rp-back">−1</button>
        <select id="rp-speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="20">20x</option></select>
        <input id="rp-scrub" type="range" min="10" max="100" value="80">
        <input id="rp-date" type="date">
        <span id="rp-label"></span>
        <button id="rp-exit">Exit replay</button>
      </div>
    </div>
    <aside class="watch" id="watch">
      <div class="whead"><select id="list"></select><span id="nlists" style="font-size:10px;color:var(--mut)"></span></div>
      <div class="wtabs" id="wtabs"></div>
      <div id="w-list">
        <div class="letters" id="letters"></div>
        <div class="filt"><input id="q" placeholder="Search any list symbol  (Ctrl+K)"></div>
        <div class="filt"><input id="paste" placeholder="Paste NVDA,AAPL,FRED:DGS10 — new list"></div>
        <div id="hits"></div>
        <div class="cols" id="cols"><span></span><span data-s="sym">Symbol</span><span data-s="last">Last</span><span data-s="chg">Chg%</span><span data-s="chgv">Chg</span><span>Vol</span><span>Spark</span></div>
        <div id="wlist"></div>
      </div>
      <div class="detail" id="detail"></div>
      <div id="intel"></div>
      <div id="heat" style="display:none"></div>
      <div id="news" style="display:none"></div>
      <div id="alerts" style="display:none"></div>
      <div id="tech" style="display:none"></div>
      <div id="cal" style="display:none"></div>
      <div id="notes" style="display:none"></div>
    </aside>
  </div>
  <div class="foot"><span id="clock"></span><span id="tzlab">UTC</span><span id="cd"></span><span id="stat"></span><span style="margin-left:auto"><a href="/chart-pro.html">Chart Pro</a> · lists merge-only · type ticker · Ctrl+K · Shift+click measure</span></div>
</div>
<div id="fly"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="cmdk"><div class="box"><input id="cmdin" placeholder="Search symbols, indicators, drawings, commands…"><div class="res" id="cmdres"></div></div></div>
<div id="typeq"></div>
<div id="ctx"></div>
<div id="toast"></div>
<script src="/jh-chart-engine.js?v=tv6.3"></script>
</body>
</html>
