<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart · JustHodl.AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://justhodl.ai/chart.html">
<meta name="jh-engine" content="justhodl-chart">
<meta name="jh-output" content="data/jh-internals.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/jh-warehouse-routing.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#fff;--raised:#f8f9fd;--chip:#eef0f6;--fg:#131722;--mut:#6a6d78;--line:#e0e3eb;--up:#089981;--dn:#f23645;--acc:#2962ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fff;color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button,select,input{background:none;border:0;color:inherit;font:inherit}button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;height:36px;border-bottom:1px solid var(--line);background:var(--raised);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut);white-space:nowrap}
.tab.on{background:#fff;color:var(--fg)}.up{color:var(--up)}.dn{color:var(--dn)}
.bar{display:flex;align-items:center;gap:2px;height:34px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;flex-wrap:nowrap}
.bar button{padding:4px 7px;border-radius:4px;color:var(--mut)}.bar button.on{background:var(--chip);color:var(--acc)}
.row{display:flex;flex:1;min-height:0}
.rail{width:36px;border-right:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.rail button{width:28px;height:28px;border-radius:4px;color:var(--mut)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.quote{display:flex;gap:10px;align-items:center;height:30px;padding:0 12px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;overflow-x:auto}
#chart{flex:1;position:relative;min-height:0;background:#fff}#host{position:absolute;inset:0}
#legend{position:absolute;left:12px;top:8px;z-index:4;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut);pointer-events:none}
#legend button{pointer-events:auto;display:block;text-align:left;padding:1px 0}
.watch{width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff;min-width:280px}
.whead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.whead select{flex:1;min-width:0;font-weight:500;font-size:12px}
.letters{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.letters button{width:18px;height:18px;border-radius:50%;font-size:9px;font-family:"IBM Plex Mono",monospace;color:var(--mut)}
.letters button.on{background:var(--acc);color:#fff}
.filt{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.filt input{flex:1;font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none}
.cols{display:grid;grid-template-columns:1fr 72px 58px 58px;padding:4px 12px;font-size:10px;color:var(--mut);font-family:"IBM Plex Mono",monospace;border-bottom:1px solid var(--line)}
#wlist{flex:1;overflow:auto;min-height:80px}
.wrow{display:grid;grid-template-columns:1fr 72px 58px 58px;width:100%;padding:5px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:left}
.wrow:hover,.wrow.on{background:var(--chip)}.wrow span:nth-child(n+2){text-align:right}
#hits{max-height:120px;overflow:auto;border-bottom:1px solid var(--line)}
.hit{display:flex;justify-content:space-between;width:100%;padding:4px 12px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.hit span:last-child{color:var(--mut);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{border-top:1px solid var(--line);padding:10px 14px;font-size:12px}
.detail .px{font-size:22px;font-weight:500;font-family:"IBM Plex Mono",monospace;margin-top:4px}
.rg{height:6px;background:var(--chip);border-radius:99px;margin:6px 0 4px;position:relative}
.rg i{position:absolute;inset:0 auto 0 0;background:var(--up);border-radius:99px}.rg b{position:absolute;top:-2px;width:8px;height:10px;background:var(--fg);border-radius:2px}
#intel{border-top:1px solid var(--line);padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;max-height:160px;overflow:auto}
#intel b{letter-spacing:1px;color:var(--acc);font-size:10px}
.cell{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--chip)}
.buy{background:#e6f6f2;color:var(--up);padding:2px 8px;border-radius:4px}.sell{background:#fde8ea;color:var(--dn);padding:2px 8px;border-radius:4px}
.foot{height:26px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mut);background:var(--raised)}
@media(max-width:720px){.watch{position:absolute;inset:36px 0 26px auto;z-index:8;width:min(100%,360px);box-shadow:0 0 0 1px var(--line)}.rail{display:none}}
</style>
</head>
<body>
<div id="app" data-engine="justhodl-chart" data-output="data/jh-internals.json">
  <div class="tabs" id="tabs"></div>
  <div class="bar" id="tfbar"></div>
  <div class="bar" id="chgbar"></div>
  <div class="row">
    <div class="rail" id="rail"></div>
    <div class="main">
      <div class="quote" id="quote"></div>
      <div id="chart"><div id="host"></div><div id="legend"></div></div>
    </div>
    <aside class="watch">
      <div class="whead"><select id="list"></select><span id="nlists" style="font-size:10px;color:var(--mut)"></span></div>
      <div class="letters" id="letters"></div>
      <div class="filt"><input id="q" placeholder="Search any list symbol"></div>
      <div class="filt"><input id="paste" placeholder="Paste NVDA,AAPL,FRED:DGS10 — new list"></div>
      <div id="hits"></div>
      <div class="cols"><span>Symbol</span><span style="text-align:right">Last</span><span style="text-align:right">Chg</span><span style="text-align:right">Chg%</span></div>
      <div id="wlist"></div>
      <div class="detail" id="detail"></div>
      <div id="intel"></div>
    </aside>
  </div>
  <div class="foot"><span id="clock"></span><span style="margin-left:auto">Chart engine · lists copied from Pro · Pro not modified</span></div>
</div>
<script src="/jh-chart-engine.js"></script>
</body>
</html>
