.foot a,.foot button{color:var(--acc)}
#livepill{display:inline-flex;align-items:center;gap:4px}
#livepill i{width:6px;height:6px;border-radius:50%;background:var(--mut)}
#livepill.on i{background:var(--up);box-shadow:0 0 6px var(--up)}
#replay{display:none;align-items:center;gap:8px;height:36px;padding:0 10px;border-top:1px solid var(--line);background:var(--raised);font-family:"IBM Plex Mono",monospace;font-size:11px;flex:none}
#replay.on{display:flex}
#replay input[type=range]{flex:1}
#modal{display:none;position:fixed;inset:0;z-index:40;background:rgba(19,23,34,.35);align-items:flex-start;justify-content:center;padding-top:8vh}
#modal.on{display:flex}
#modal .box{width:min(560px,94vw);max-height:80vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;color:var(--fg)}
#modal h3{margin:0 0 10px;font-size:14px}
.indrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--chip);font-family:"IBM Plex Mono",monospace;font-size:12px}
.icat{font-size:10px;letter-spacing:1px;color:var(--acc);margin:10px 0 4px}
#ctx{display:none;position:fixed;z-index:50;background:var(--bg);border:1px solid var(--line);border-radius:6px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-family:"IBM Plex Mono",monospace;font-size:12px}
#ctx button{display:block;width:100%;text-align:left;padding:8px 12px}
#ctx button:hover{background:var(--chip)}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#131722;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;z-index:60;display:none}
#toast.on{display:block}
#obj{position:absolute;bottom:8px;left:48px;z-index:6;width:240px;max-height:200px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:none}
#obj.on{display:block}
#fly{display:none;position:fixed;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(19,23,34,.18);min-width:190px;max-height:70vh;overflow:auto;padding:6px 0;font-family:"IBM Plex Mono",monospace;font-size:12px}
#fly.on{display:block}
#fly button{display:block;width:100%;text-align:left;padding:7px 14px;color:var(--fg)}
#fly button:hover,#fly button.on{background:var(--chip);color:var(--acc)}
#fly .lab{padding:6px 14px;font-size:10px;letter-spacing:1px;color:var(--mut)}
#cmdk{display:none;position:fixed;inset:0;z-index:45;background:rgba(19,23,34,.28);align-items:flex-start;justify-content:center;padding-top:12vh}
#cmdk.on{display:flex}
#cmdk .box{width:min(560px,94vw);background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 16px 48px rgba(19,23,34,.18)}
#cmdk input{width:100%;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line);outline:none;font-family:"IBM Plex Sans",sans-serif;background:var(--bg);color:var(--fg)}
#cmdk .res{max-height:360px;overflow:auto}
#cmdk .res button{display:flex;justify-content:space-between;width:100%;padding:9px 16px;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:left}
#cmdk .res button:hover,#cmdk .res button.on{background:var(--chip)}
#cmdk .res button span{color:var(--mut)}
#props{position:absolute;top:40px;left:52px;z-index:6;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:200px;font-family:"IBM Plex Mono",monospace;font-size:11px;display:none}
#props.on{display:block}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sw i{width:16px;height:16px;border-radius:50%;display:block;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:var(--fg)}
#typeq{display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:46;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:min(420px,92vw);max-height:50vh;overflow:auto;box-shadow:0 12px 32px rgba(19,23,34,.14);font-family:"IBM Plex Mono",monospace;font-size:12px}
#typeq.on{display:block}
#typeq .lab{padding:8px 14px;font-size:10px;letter-spacing:1px;color:var(--mut)}
#typeq button{display:flex;justify-content:space-between;width:100%;padding:8px 14px;text-align:left}
#typeq button:hover{background:var(--chip)}
#typeq button span{color:var(--mut)}
.heatgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0}
.hcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:10px;padding:4px}
.hcell span{opacity:.9;font-size:9px}
.srow{display:grid;grid-template-columns:1fr 54px 48px 40px 48px;gap:4px;padding:4px 0;border-bottom:1px solid var(--chip);align-items:center;width:100%;text-align:left;font-size:11px}
.srow span:nth-child(n+2){text-align:right}
.sbar{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sbar button{padding:3px 8px;border:1px solid var(--line);border-radius:99px;font-size:10px;color:var(--mut)}
.sbar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tbtn{padding:6px 14px;border-radius:4px;font-weight:600;font-size:12px}
.tbtn.buyx{background:var(--up);color:#fff}.tbtn.sellx{background:var(--dn);color:#fff}
.tqty{width:72px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:"IBM Plex Mono",monospace}
.kgrid{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:11px}
.kgrid span:nth-child(odd){color:var(--acc);font-family:"IBM Plex Mono",monospace}
.season{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.scell{padding:8px 4px;border-radius:4px;text-align:center}
.corm{display:grid;gap:2px;margin-top:8px;font-size:9px}
#dock{flex:none;border-top:1px solid var(--line);background:var(--raised)}
#dock .dtabs{display:flex;height:28px;align-items:stretch;font-family:"IBM Plex Mono",monospace;font-size:11px;overflow-x:auto}
#dock .dtabs button{padding:0 12px;color:var(--mut);white-space:nowrap}
#dock .dtabs button.on{color:var(--acc);background:var(--bg);border-top:2px solid var(--acc)}
#dockbody{display:none;max-height:220px;overflow:auto;background:var(--bg);padding:10px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px}
#dock.on #dockbody{display:block}
#listfab{display:none;position:fixed;bottom:36px;right:10px;z-index:20;background:var(--acc);color:#fff;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:600;box-shadow:0 6px 18px rgba(41,98,255,.35)}
#app.chart-only .watch{display:none}
#app.chart-only .rail{width:0;overflow:hidden;border:0;padding:0}
@media(max-width:720px){
  .watch{position:absolute;inset:36px 0 26px 0;z-index:8;width:100%;max-width:none;box-shadow:0 0 0 1px var(--line)}
  .watch.hide{display:none!important}
  .rail{display:none}
  #stage.split2,#stage.split4{grid-template-columns:1fr;grid-template-rows:1fr}
  .pane:nth-child(n+2){display:none!important}
  .heatgrid{grid-template-columns:repeat(3,1fr)}
  #dock,#mini{display:none!important}
  #tfbar{flex-wrap:wrap;height:auto;min-height:52px;padding:4px 6px}
  #tfbar .wsico{display:none}
  #symin,#tab-search{display:flex!important;min-width:72px}
  #dwin,#dwin.on{display:none!important}
  #listfab{display:block}
  #legend{max-width:70%}
  #wm{font-size:36px}
}

.tv-symlogo{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:0}

#dtype .src{margin-top:16px;font-size:11px;color:#787b86}
#dtype .empty{padding:40px 12px;color:#787b86;text-align:center}
#etfhud{display:none;flex-wrap:wrap;gap:10px;align-items:center;min-height:28px;padding:3px 12px;border-bottom:1px solid var(--line,#2a2e39);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut,#787b86);background:var(--raised,#1e222d);flex:none}
#etfhud.on{display:flex}
#etfhud b{color:var(--fg,#d1d4dc);font-weight:600}
#etfhud a{color:#2962ff}
#etfhud .pill{padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;background:#2a2e39;color:#d1d4dc}
#etfhud .pill.in{background:#0e2e28;color:#089981}
#etfhud .pill.out{background:#3a1518;color:#f23645}
#etfhud .up{color:#089981}#etfhud .dn{color:#f23645}
#etfhud button{height:22px;padding:0 8px;border:1px solid #2a2e39;border-radius:4px;color:#d1d4dc;margin-left:auto}
#etfhud button:hover{border-color:#2962ff;color:#fff}
#volhud{display:none;flex-wrap:wrap;gap:10px;align-items:center;min-height:28px;padding:3px 12px;border-bottom:1px solid var(--line,#2a2e39);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut,#787b86);background:var(--raised,#1e222d);flex:none;cursor:pointer}
#volhud.on{display:flex}
#volhud b{color:var(--fg,#d1d4dc);font-weight:600}
#volhud .pill{padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;background:#2a2e39;color:#d1d4dc}
#volhud .pill.in{background:#0e2e28;color:#089981}
#volhud .pill.out{background:#3a1518;color:#f23645}
#volhud .up{color:#089981}#volhud .dn{color:#f23645}
#volhud button{height:22px;padding:0 8px;border:1px solid #2a2e39;border-radius:4px;color:#d1d4dc;margin-left:auto;cursor:pointer}
#volhud button:hover{border-color:#2962ff;color:#fff}
@media(max-width:900px){
  #dtype .kpi{grid-template-columns:repeat(3,1fr)}
  .tv-symwrap{padding-left:6px}
  .tv-symchip{min-width:120px}
}

<div id="app" data-engine="justhodl-chart" data-output="data/jh-internals.json" data-jh-sections="off">

        <span class="tv-symid" id="symchip-id">SPY</span>
        <span class="tv-caret">▾</span>

      <label class="tab-search" id="tab-search">
        <span class="ts-ico">⌕</span>
        <input id="symin" placeholder="Symbol, ISIN, or CUSIP" autocomplete="off" spellcheck="false" title="Ticker, ISIN, CUSIP. Or AAPL DES <GO>">
      </label>
      <button type="button" class="tv-iconbtn" id="btn-addcmp" title="Compare symbols">+</button>
      <button type="button" class="tv-iconbtn" id="btn-dtype" title="Financials, ratios & statistics">
        <svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true"><rect x="2.2" y="3.2" width="13.6" height="11.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.2 7.2h13.6M7.4 3.2v11.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <a class="tv-iconbtn" id="chart-data-sources" href="/engine-data.html?page=chart.html" data-jh-inspection-route="chart.html" target="_blank" rel="noopener" title="Inspect chart source outputs in a separate view" aria-label="Inspect chart data sources (opens a new tab)" style="width:auto;padding:0 8px;text-decoration:none">Data</a>
    </div>
    <div class="tab-strip" id="tabs"></div>
  </div>
  <div class="bar" id="tfbar"></div>
  <div id="favs"></div>
  <div class="bar" id="chgbar"></div>
  <div class="row">

      <div id="etfhud"></div>
      <div id="volhud"></div>
      <div id="tape"></div>
      <div id="stage">
        <div class="pane" id="chart">
          <div class="host" id="host"></div>
          <div id="wm"></div>
          <canvas id="vp"></canvas>
          <svg id="patov"></svg>
          <svg id="draw"></svg>
          <div id="legend"></div>
          <div id="cmpchips"></div>
          <div id="hud"></div>
          <div id="dwin"></div>

          <div id="obj"></div>
          <div id="props"></div>
          <div id="tv-zoom"><button type="button" id="z-minus" title="Zoom out">−</button><button type="button" id="z-plus" title="Zoom in">+</button></div>
        </div>
        <div class="pane" id="chart2" style="display:none"><div class="host" id="host2"></div></div>
        <div class="pane" id="chart3" style="display:none"><div class="host" id="host3"></div></div>
        <div class="pane" id="chart4" style="display:none"><div class="host" id="host4"></div></div>
      </div>
      <div id="oscwrap"></div>
      <div id="mini"></div>
      <div id="replay">
        <button id="rp-play">Play</button>
        <button id="rp-step">Step</button>
        <button id="rp-back">−1</button>
        <select id="rp-speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="20">20x</option></select>
        <input id="rp-scrub" type="range" min="10" max="100" value="80">
        <input id="rp-date" type="date">
        <span id="rp-label"></span>
        <button id="rp-exit">Exit replay</button>
      </div>
    </div>
    <aside class="watch is-collapsed" id="watch">
      <div class="w-split" id="w-split" title="Drag to resize watchlist"></div>
      <div class="wtitle"><b>Watchlist</b>
        <div class="wops">
          <button type="button" id="w-searchbtn" title="Search symbol">⌕</button>
          <button type="button" id="w-chartm" title="Chart / company info">◆</button>
          <button type="button" id="w-pin" title="Pin watchlist">📌</button>
          <button type="button" id="w-close" title="Close">×</button>
        </div>
      </div>
      <div class="whead">
        <button type="button" class="listbtn" id="listbtn" title="Switch watchlist">Select list ▾</button>
        <select id="list" hidden></select>
        <span id="nlists" style="font-size:10px;color:var(--mut)"></span>
        <div class="wops">
          <button type="button" id="w-new" title="New list">+</button>
          <button type="button" id="w-menu" title="List menu">⋮</button>
        </div>
      </div>
      <div class="wsub" id="wsub"></div>
      <div class="wtabs" id="wtabs"></div>
      <div id="w-list">
        <div class="filt wq"><span>⌕</span><input id="q" placeholder="Search"></div>
        <div class="letters" id="letters"></div>
        <div class="filt"><input id="paste" placeholder="Paste NVDA,AAPL,FRED:DGS10 — new list"></div>
        <div id="hits"></div>
        <div class="cols" id="cols"><span></span><span data-s="sym">Symbol</span><span data-s="last">Last</span><span data-s="chgv">Chg</span><span data-s="chg">Chg%</span></div>
        <div id="wlist"></div>
        <button type="button" class="addsym" id="addsym">+ Add symbol</button>
      </div>
      <div id="wd-split" title="Drag to resize list / details"></div>
      <div id="w-stack">
        <div class="detail tvcard" id="detail"></div>
        <div id="fin"></div>
        <div id="over"></div>
        <div id="tech"></div>
        <div id="season"></div>
        <div id="notes"></div>
        <div id="alerts"></div>
        <div id="cal"></div>
        <div id="news"></div>
        <div id="heat"></div>
        <div id="screen"></div>
        <div id="trade"></div>
        <div id="test"></div>
        <div id="corr"></div>
        <div id="qr"></div>
      </div>
      <div id="intel"></div>
      <div id="desk-intel" style="display:none"></div>
    </aside>
    <aside id="rrail" aria-label="Panels">
      <button type="button" data-rail="watch" title="Watchlist">☰</button>
      <button type="button" data-rail="details" title="Symbol details">◆</button>
      <button type="button" data-rail="news" title="News">N</button>
      <button type="button" data-rail="alerts" title="Alerts">🔔</button>
    </aside>
  </div>
  <div id="dock">
    <div class="dtabs" id="dtabs"></div>
    <div id="dockbody"></div>
  </div>
  <div class="foot"><span id="clock"></span><span id="tzlab">UTC</span><span id="cd">v12 QR</span><span id="livepill"><i></i> LIVE</span><span id="stat"></span><span style="margin-left:auto"><button id="btn-keys">Hotkeys</button> · <a href="/chart-pro.html">Chart Pro</a> · / search · click ticker · Ctrl+K</span></div>
</div>
<button id="listfab">List</button>
<div id="listdrop"><input id="listq" placeholder="Search lists" autocomplete="off"><div id="listres"></div></div>
<div id="fly"></div>
<div id="menu" class="menu"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="cmdk"><div class="box"><input id="cmdin" placeholder="AAPL DES <GO>  ·  functions, symbols, studies"><div class="res" id="cmdres"></div></div></div>
<div id="typeq"></div>
<div id="symsearch"><div class="sbox">
  <div class="shd"><b id="sshd">Symbol search</b><button type="button" id="ssx" title="Close">×</button></div>
  <div class="ssearch"><span>⌕</span><input id="ssin" placeholder="Any ticker, CUSIP, FIGI, FRED, Eurostat, BoJ, NY Fed…" autocomplete="off"></div>
  <div class="sschips" id="sschips"></div>
  <div id="ssres"></div>
</div></div>

  <div class="dtbody" id="dtbody"></div>
</div></div>
