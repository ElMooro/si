<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart · JustHodl.AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://justhodl.ai/chart.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#131722;--raised:#1e222d;--chip:#2a2e39;--fg:#d1d4dc;--mut:#787b86;--line:#2a2e39;--up:#26a69a;--dn:#ef5350;--acc:#2962ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button{background:none;border:0;color:inherit;cursor:pointer;font:inherit}
#app{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;height:36px;border-bottom:1px solid var(--line);background:var(--raised);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap;color:var(--mut)}
.tab.on{background:var(--bg);color:var(--fg)}
.tab .chg.up{color:var(--up)} .tab .chg.dn{color:var(--dn)}
.bar{display:flex;align-items:center;gap:4px;height:36px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;font-family:"IBM Plex Mono",monospace;font-size:12px}
.bar button{padding:3px 7px;border-radius:4px;color:var(--mut)}
.bar button.on{background:var(--chip);color:var(--acc)}
.row{display:flex;flex:1;min-height:0}
.rail{width:36px;border-right:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.rail button{width:28px;height:28px;border-radius:4px;color:var(--mut);font-size:13px}
.rail button.on{background:var(--chip);color:var(--acc)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.quote{display:flex;gap:12px;align-items:center;height:32px;padding:0 12px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12px;overflow-x:auto}
#chart{flex:1;position:relative;min-height:0}
#host{position:absolute;inset:0}
#legend{position:absolute;left:12px;top:8px;z-index:4;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mut);pointer-events:none}
#legend button{pointer-events:auto;display:block;text-align:left;padding:1px 0}
.watch{width:220px;border-left:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column}
.watch input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 10px;color:var(--fg);font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none}
.wrow{display:flex;justify-content:space-between;padding:7px 12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mut)}
.wrow.on,.wrow:hover{background:var(--chip);color:var(--fg)}
.foot{height:28px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mut)}
.buy{background:rgba(38,166,154,.18);color:var(--up);padding:2px 8px;border-radius:4px}
.sell{background:rgba(239,83,80,.18);color:var(--dn);padding:2px 8px;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div class="bar" id="tfbar"></div>
  <div class="row">
    <div class="rail" id="rail"></div>
    <div class="main">
      <div class="quote" id="quote"></div>
      <div id="chart"><div id="host"></div><div id="legend"></div></div>
    </div>
    <aside class="watch">
      <input id="q" placeholder="Search symbol">
      <div id="wlist"></div>
    </aside>
  </div>
  <div class="foot"><span id="clock"></span><span style="margin-left:auto">JustHodl Chart · Binance + warehouse · not TradingView</span></div>
</div>
<script>
const PROXY="https://justhodl-data-proxy.raafouis.workers.dev";
const TFS=[["1s","1s",1],["1m","1m",60],["1h","1h",3600],["4h","4h",14400],["12h","12h",43200],["1d","D",86400],["1w","W",604800],["1M","M",2592000],["3M","3M",7776000]];
const SYMS=[
  {id:"BTCUSDT",t:"BTCUSDT",name:"Bitcoin / TetherUS",src:"binance",venue:"Binance"},
  {id:"ETHB",t:"ETHB",name:"ETHB",src:"yahoo",venue:"NASDAQ"},
  {id:"PEPEUSDT",t:"PEPEUSDT",name:"PEPE / TetherUS",src:"binance",venue:"Binance"},
  {id:"CNEQ",t:"CNEQ",name:"CNEQ",src:"yahoo",venue:"NASDAQ"},
  {id:"PURR",t:"PURR",name:"PURR",src:"yahoo",venue:"NASDAQ"},
  {id:"BMNR",t:"BMNR",name:"Bitmine",src:"yahoo",venue:"NASDAQ"},
  {id:"ATO",t:"ATO",name:"Atmos Energy",src:"yahoo",venue:"NYSE"},
  {id:"NVDA",t:"NVDA",name:"NVIDIA",src:"yahoo",venue:"NASDAQ"},
  {id:"SPY",t:"SPY",name:"S&P 500 ETF",src:"yahoo",venue:"ARCA"}
];
const INDS=[
  {id:"sma50",n:"SMA 50 close",c:"#2962ff",on:1,p:50,k:"sma"},
  {id:"sma250",n:"SMA 250 close",c:"#e91e63",on:1,p:250,k:"sma"},
  {id:"sma200",n:"SMA 200 close",c:"#ff6d00",on:1,p:200,k:"sma"},
  {id:"ema250",n:"EMA 250 close",c:"#089981",on:1,p:250,k:"ema"},
  {id:"sma20",n:"SMA 20 close",c:"#26c6da",on:1,p:20,k:"sma"},
  {id:"bb",n:"BB 20 SMA close 2",c:"#ab47bc",on:1,k:"bb"}
];
let active="PEPEUSDT", tf="3M", kind="candles", quotes={};
const UP="#26a69a", DN="#ef5350", BG="#131722";
function fmt(p){if(!p&&p!==0)return "—";const a=Math.abs(p);if(a>=1000)return p.toLocaleString(undefined,{maximumFractionDigits:2});if(a>=1)return p.toFixed(2);if(a>=0.01)return p.toFixed(4);return p.toFixed(8).replace(/0+$/,"").replace(/\.$/,"");}
function sma(d,n){const o=[];let s=0;for(let i=0;i<d.length;i++){s+=d[i].close;if(i>=n)s-=d[i-n].close;if(i>=n-1)o.push({time:d[i].time,value:s/n});}return o;}
function ema(d,n){const o=[];const k=2/(n+1);let p=d[0]&&d[0].close;for(let i=0;i<d.length;i++){p=d[i].close*k+p*(1-k);if(i>=n-1)o.push({time:d[i].time,value:p});}return o;}
async function bars(sym,tfId){
  const spec=TFS.find(x=>x[0]===tfId)||TFS[5];
  const iv=spec[0]==="3M"?"1M":spec[1]==="D"?"1d":spec[1]==="W"?"1w":spec[1]==="M"?"1M":spec[0];
  if(sym.src==="binance"){
    const r=await fetch("https://api.binance.com/api/v3/klines?symbol="+sym.t+"&interval="+iv+"&limit=500");
    if(!r.ok) throw 0;
    const j=await r.json();
    let d=j.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
    if(tfId==="3M"){const m={};d.forEach(b=>{const t=b.time-b.time%(86400*90);const x=m[t]||(m[t]={time:t,open:b.open,high:b.high,low:b.low,close:b.close,volume:0});x.high=Math.max(x.high,b.high);x.low=Math.min(x.low,b.low);x.close=b.close;x.volume+=b.volume;});d=Object.values(m).sort((a,b)=>a.time-b.time);}
    return d;
  }
  const range=spec[2]>=86400*20?"10y":"2y";
  const interval=spec[2]<=3600?"60m":spec[2]<=86400?"1d":"1wk";
  let r=await fetch(PROXY+"/ohlc?ticker="+encodeURIComponent(sym.t)+"&range="+range+"&interval="+interval).catch(()=>null);
  if(!r||!r.ok) r=await fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(sym.t)+"?range="+range+"&interval="+interval);
  const j=await r.json();
  const res=j.chart&&j.chart.result&&j.chart.result[0];
  if(res){
    const q=res.indicators.quote[0], ts=res.timestamp||[];
    const d=[];
    for(let i=0;i<ts.length;i++) if(q.close[i]!=null) d.push({time:ts[i],open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i],volume:q.volume[i]||0});
    return d;
  }
  if(Array.isArray(j.bars)) return j.bars;
  if(j.timestamp){const d=[];for(let i=0;i<j.timestamp.length;i++) if(j.close[i]!=null) d.push({time:j.timestamp[i],open:j.open[i],high:j.high[i],low:j.low[i],close:j.close[i],volume:j.volume[i]||0});return d;}
  throw 0;
}
const chart=LightweightCharts.createChart(document.getElementById("host"),{
  autoSize:true,
  layout:{background:{type:"solid",color:BG},textColor:"#787b86",fontFamily:"IBM Plex Sans,sans-serif",fontSize:11},
  grid:{vertLines:{color:"#1e222d"},horzLines:{color:"#1e222d"}},
  rightPriceScale:{borderColor:"#2a2e39",scaleMargins:{top:0.06,bottom:0.18}},
  timeScale:{borderColor:"#2a2e39",timeVisible:true},
  localization:{priceFormatter:fmt}
});
let series=[], lastBars=[];
function wipe(){series.forEach(s=>{try{chart.removeSeries(s);}catch(e){}});series=[];}
function paint(d){
  wipe(); lastBars=d;
  const c=chart.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,lastValueVisible:true});
  c.setData(d); series.push(c);
  const v=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"vol"});
  chart.priceScale("vol").applyOptions({scaleMargins:{top:0.82,bottom:0}});
  v.setData(d.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?"rgba(38,166,154,.35)":"rgba(239,83,80,.35)"})));
  series.push(v);
  INDS.forEach(ind=>{
    if(!ind.on) return;
    if(ind.k==="sma"){const s=chart.addLineSeries({color:ind.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false});s.setData(sma(d,ind.p));series.push(s);}
    if(ind.k==="ema"){const s=chart.addLineSeries({color:ind.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false});s.setData(ema(d,ind.p));series.push(s);}
    if(ind.k==="bb"){const m=sma(d,20);const up=[],dn=[];for(let i=19;i<d.length;i++){let s=0;for(let j=0;j<20;j++){const dv=d[i-j].close-m[i-19].value;s+=dv*dv;}const sd=Math.sqrt(s/20);up.push({time:d[i].time,value:m[i-19].value+2*sd});dn.push({time:d[i].time,value:m[i-19].value-2*sd});}
      const a=chart.addLineSeries({color:ind.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false});a.setData(up);
      const b=chart.addLineSeries({color:ind.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false});b.setData(m);
      const e=chart.addLineSeries({color:ind.c,lineWidth:1,lastValueVisible:false,priceLineVisible:false});e.setData(dn);
      series.push(a,b,e);
    }
  });
  chart.timeScale().fitContent();
  const last=d[d.length-1], prev=d[d.length-2]||last;
  const chg=prev.close?(last.close-prev.close)/prev.close:0;
  const up=chg>=0;
  document.getElementById("quote").innerHTML=`<b>${sym().name} · ${TFS.find(x=>x[0]===tf)[1]} · ${sym().venue}</b>
    <span>O${fmt(last.open)} H<span style="color:${UP}">${fmt(last.high)}</span> L<span style="color:${DN}">${fmt(last.low)}</span> C<span style="color:${up?UP:DN}">${fmt(last.close)}</span></span>
    <span style="color:${up?UP:DN}">${up?"+":""}${fmt(last.close-last.open)} (${(chg*100).toFixed(2)}%)</span>
    <span style="margin-left:auto" class="sell">${fmt(last.close)} SELL</span><span class="buy">${fmt(last.close*1.001)} BUY</span>`;
}
function sym(){return SYMS.find(s=>s.id===active);}
async function load(){try{paint(await bars(sym(),tf));}catch(e){document.getElementById("quote").textContent="No bars for "+active;}}
function renderTabs(){
  document.getElementById("tabs").innerHTML=SYMS.slice(0,7).map(s=>{
    const q=quotes[s.id]; const up=q&&q.chg>=0;
    return `<button class="tab ${s.id===active?"on":""}" data-id="${s.id}">${s.t.replace("USDT","")} ${q?`<span class="chg ${up?"up":"dn"}">${fmt(q.last)} ${up?"+":""}${(q.chg*100).toFixed(2)}%</span>`:""}</button>`;
  }).join("")+`<button class="tab" id="add">+</button>`;
  document.querySelectorAll(".tab[data-id]").forEach(b=>b.onclick=()=>{active=b.dataset.id;renderTabs();renderWatch();load();});
}
function renderTf(){
  document.getElementById("tfbar").innerHTML=TFS.map(t=>`<button class="${t[0]===tf?"on":""}" data-tf="${t[0]}">${t[1]}</button>`).join("");
  document.querySelectorAll("#tfbar [data-tf]").forEach(b=>b.onclick=()=>{tf=b.dataset.tf;renderTf();load();});
}
function renderLegend(){
  document.getElementById("legend").innerHTML=`<div style="color:#d1d4dc;margin-bottom:4px">${sym().name} · ${sym().venue}</div>`+
    INDS.map(i=>`<button style="color:${i.on?i.c:"#787b86"};opacity:${i.on?1:.4}" data-i="${i.id}">${i.n}</button>`).join("");
  document.querySelectorAll("#legend [data-i]").forEach(b=>b.onclick=()=>{const i=INDS.find(x=>x.id===b.dataset.i);i.on=!i.on;renderLegend();if(lastBars.length)paint(lastBars);});
}
function renderWatch(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  const list=SYMS.filter(s=>!q||s.t.toLowerCase().includes(q)||s.name.toLowerCase().includes(q));
  document.getElementById("wlist").innerHTML=list.map(s=>`<button class="wrow ${s.id===active?"on":""}" data-id="${s.id}"><span>${s.t}</span><span>${s.venue}</span></button>`).join("");
  document.querySelectorAll(".wrow").forEach(b=>b.onclick=()=>{active=b.dataset.id;renderTabs();renderWatch();renderLegend();load();});
}
document.getElementById("rail").innerHTML=["+","/","—","[]","fib","T"].map((x,i)=>`<button ${i===0?"class=on":""}>${x}</button>`).join("");
document.getElementById("q").oninput=renderWatch;
async function tick(){
  await Promise.all(SYMS.slice(0,7).map(async s=>{
    try{
      if(s.src==="binance"){
        const r=await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol="+s.t);
        const j=await r.json(); quotes[s.id]={last:+j.lastPrice,chg:+j.priceChangePercent/100};
      } else {
        const r=await fetch(PROXY+"/ohlc?ticker="+encodeURIComponent(s.t));
        const j=await r.json();
        if(j.last!=null){quotes[s.id]={last:+j.last,chg:+(j.chg||0)}; return;}
        const bars=j.bars||[]; const last=bars[bars.length-1], prev=bars[bars.length-2]||last;
        if(last) quotes[s.id]={last:last.close||last.value,chg:prev&&prev.close?(last.close-prev.close)/prev.close:0};
      }
    }catch(e){}
  }));
  renderTabs();
}
function clock(){document.getElementById("clock").textContent=new Date().toISOString().slice(11,19)+" UTC";}
renderTabs(); renderTf(); renderLegend(); renderWatch(); load(); tick(); clock();
setInterval(tick,30000); setInterval(clock,1000);
</script>
</body>
</html>
