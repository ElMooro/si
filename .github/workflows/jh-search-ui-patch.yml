name: Prepare isolated search patch
on:
  push:
    branches: [feature/macro-search-add-all-ui-2026-11-10]
    paths: [.github/workflows/jh-search-ui-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/macro-search-add-all-ui-2026-11-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macro-search-add-all-ui-2026-11-10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and patch search only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('jh-uni-search.js')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='432e782fa3fc49cd8d49dd4c22efa4ae57c5add6', 'Source changed; refusing patch'
          s=raw.decode()
          a='    var html = "", grp = "";\n    ROWS.forEach(function (r, i) {'
          b='''    var html = "", grp = "";
              var loadedCount = ROWS.filter(addable).length;
              if (loadedCount) html += '<div class="us-loaded-all"><span>Current loaded results <small>Datasets are added separately</small></span><button type="button" class="us-ga" data-act="addloaded" title="Add eligible loaded results to the active watchlist">+ Add all ' + loadedCount + '</button></div>';
              ROWS.forEach(function (r, i) {'''
          c='    if (act === "cover") { renderCoverage(); return; }'
          d=c+'\n    if (act === "addloaded") { e.stopPropagation(); var seen = Object.create(null); addAll(ROWS.filter(addable).map(function (x) { return x.id; }).filter(function (id) { if (seen[id]) return false; seen[id] = true; return true; }), "current loaded results", a); return; }'
          assert s.count(a)==1 and s.count(c)==1, 'Missing or ambiguous anchors'
          s=s.replace(a,b).replace(c,d)
          assert s.replace(b,a).replace(d,c).encode()==raw, 'Unexpected changes'
          css='''#jhus .us-dlg{width:min(1000px,calc(100vw - 32px));height:min(82vh,860px);margin-top:6vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
          #jhus .us-hd{padding:20px 24px 12px;gap:16px}
          #jhus .us-dlg input[type=text],#jhus .us-dlg input[type=search],#jhus .us-dlg input:not([type]){font-size:20px;min-height:48px}
          #jhus .us-row{min-height:60px;padding:12px 24px;gap:14px}
          #jhus .us-loaded-all{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--bg)}
          #jhus .us-loaded-all small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
          #jhus .us-loaded-all .us-ga{flex:none;min-height:36px;padding:6px 16px;border-radius:18px;border-color:var(--blue);color:var(--blue)}
          #jhus .us-loaded-all .us-ga:hover{color:#fff;background:var(--blue)}
          #jhus .us-loaded-all .us-ga:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
          @media(max-width:640px){#jhus .us-dlg{width:calc(100vw - 16px);height:90dvh;margin-top:4dvh;border-radius:10px}#jhus .us-hd{padding:14px 16px 10px}#jhus .us-row{padding:10px 16px;gap:8px}#jhus .us-loaded-all{padding:10px 16px;gap:8px;flex-wrap:wrap}#jhus .us-dlg input{font-size:17px}}'''
          s+='\n/* Scoped search-dialog presentation; no data or chart changes. */\n(function(){"use strict";if(document.getElementById("jh-search-ui-20261110"))return;var s=document.createElement("style");s.id="jh-search-ui-20261110";s.textContent='+json.dumps(css)+';document.head.appendChild(s);})();\n'
          p.write_bytes(s.encode())
          PY
          node --check jh-uni-search.js
          git diff --check
          test "$(git diff --name-only)" = "jh-uni-search.js"
      - name: Commit only to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- jh-uni-search.js
          git commit -m 'Search: add all loaded results and enlarge dialog'
          git push origin HEAD:refs/heads/feature/macro-search-add-all-ui-2026-11-10
