name: Guard lambda stubs

# Fast check on every lambda source push. Does not replace deploy-lambdas;
# it fails the SHA so a truncated Contents-API write is visible.
on:
  push:
    branches: [main]
    paths:
      - 'aws/lambdas/*/source/**'
      - 'scripts/guard_stub_lambdas.py'
  pull_request:
    paths:
      - 'aws/lambdas/*/source/**'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Reject stub or truncated lambda bodies
        # Deploy lane v2: compares every body against the push base (or the PR base),
        # so a 40 KB -> 18 KB truncation fails even though it clears the 500-byte floor.
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$GUARD_BASE_SHA" ] && [ "$GUARD_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --depth=200 origin "$GUARD_BASE_SHA" 2>/dev/null || true
          else
            unset GUARD_BASE_SHA
          fi
          python3 scripts/guard_stub_lambdas.py
