        with:
          python-version: '3.12'
      - run: python3 -m pip install -q boto3 requests
      - name: Source refresh boundary tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python3 tests/test_capital_structure_refresh.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: part-2 complete source population
        run: python3 aws/ops/checks/run_capital_structure_refresh.py part-2
  part_3:
    needs: part_2
    if: github.ref == 'refs/heads/main'
