name: Deploy Cloudflare Workers

# Deploys any Cloudflare Worker when its source changes.
# Reads the Lambda auth token from AWS SSM and sets it as an encrypted
# Worker Secret so it never appears in repo code or logs.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/workers/*/**'
      - 'tests/worker-*.test.js'
      - 'tests/reviewed-artifacts.test.js'
      - '.github/workflows/deploy-workers.yml'
      - 'scripts/worker_release.py'
      - 'aws/ops/checks/worker_release_evidence.py'
      - 'aws/ops/checks/worker_source_evidence.py'
      - 'tests/deployment/test_worker_*evidence.py'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Exact Worker name to deploy; main pushes deploy changed Workers'
        required: true
        default: 'justhodl-data-proxy'

permissions:
  contents: write

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

jobs:
  # audit 2026-09-08 INST-14: a Worker can no longer ship without its behavioural
  # tests. The auth/entitlement paths reproduced by the audit are asserted here
  # (tests/worker-*.test.js run the real module in Node with fake KV/Supabase/Stripe).
  test:
    name: Worker behavioural tests
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block published credentials
        run: python3 scripts/check_secrets.py
      - name: Brain publication boundaries
        run: |
          if [ -f tests/test_brain_public_boundaries.py ]; then
            python3 tests/test_brain_public_boundaries.py
          fi
      - name: Syntax-check every worker entrypoint
        run: |
          set -e
          for f in cloudflare/workers/*/src/*.js; do node --check "$f"; done
      - name: Run worker test suites
        run: node --test tests/worker-*.test.js tests/reviewed-artifacts.test.js
      - name: Complete Worker evidence tests
        run: |
          python3 tests/deployment/test_worker_source_evidence.py
          python3 tests/deployment/test_worker_release_evidence.py

  deploy:
    name: Deploy changed Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4.144.0

      - name: Detect changed Workers
        id: detect
        env:
          REQUESTED_WORKER: ${{ github.event.inputs.worker }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_WORKER" ]; then
            [[ "$REQUESTED_WORKER" =~ ^justhodl-[a-z0-9-]+$ ]]
            test -f "cloudflare/workers/$REQUESTED_WORKER/wrangler.toml"
            targets="$REQUESTED_WORKER"
          else
            # Diff the ENTIRE push range, not just the tip commit. A push
            # can carry several commits; HEAD^..HEAD misses worker changes
            # that aren't the tip (the old bug — deploys skipped silently).
            before="$BEFORE_SHA"
            targets=""
            if [ -n "$before" ] \
               && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before" 2>/dev/null; then
              targets=$(git diff --name-only "$before" "$GITHUB_SHA" \
                | grep '^cloudflare/workers/' \
                | awk -F/ '{print $3}' | sort -u | paste -sd ' ' - || true)
            fi
            # Workflow/evidence-only changes belong to the governed data proxy.
            # Do not redeploy unrelated Workers just because their code was absent
            # from this diff. Unresolvable ranges require an explicit target.
            if [ -z "$targets" ]; then
              if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
                targets="justhodl-data-proxy"
              else
                echo '::error::Unresolved push range; dispatch one explicit Worker'
                exit 1
              fi
            fi
          fi
          echo "Targets: $targets"
          echo "targets=$targets" >> $GITHUB_OUTPUT

      - name: Fetch AI_CHAT_TOKEN from SSM
        if: steps.detect.outputs.targets != ''
        id: ssm
        run: |
          TOKEN=$(aws ssm get-parameter \
            --name /justhodl/ai-chat/auth-token \
            --with-decryption \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$TOKEN"
          echo "AI_CHAT_TOKEN=$TOKEN" >> $GITHUB_ENV
          PA_TOKEN=$(aws ssm get-parameter \
            --name /justhodl/portfolio-admin/token \
            --with-decryption \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$PA_TOKEN"
          echo "PORTFOLIO_ADMIN_TOKEN=$PA_TOKEN" >> $GITHUB_ENV
          PA_PASS=$(aws ssm get-parameter \
            --name /justhodl/portfolio-admin/manager-pass \
            --with-decryption \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$PA_PASS"
          echo "PORTFOLIO_MGR_PASS=$PA_PASS" >> $GITHUB_ENV
          # audit 2026-09-08: data-proxy service role + provider keys come from SSM
          # (soft-fail: an absent parameter leaves the existing secret untouched;
          # ops_5219 creates the parameters and re-dispatches this workflow).
          for pair in "ADMIN_TOKEN:/justhodl/api-admin/token" "POLYGON_KEY:/justhodl/polygon/api-key" "FRED_KEY:/justhodl/fred/api-key" "FMP_KEY:/justhodl/fmp/api-key"; do
            var="${pair%%:*}"; name="${pair#*:}"
            val=$(aws ssm get-parameter --name "$name" --with-decryption --region ${{ secrets.AWS_REGION }} --query 'Parameter.Value' --output text 2>/dev/null || true)
            if [ -n "$val" ] && [ "$val" != "None" ]; then echo "::add-mask::$val"; echo "$var=$val" >> $GITHUB_ENV; echo "ssm: $name -> $var"; else echo "::warning::ssm parameter $name absent -- $var not attached this run"; fi
          done

      - name: Deploy each changed Worker
        if: steps.detect.outputs.targets != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WRANGLER_SEND_METRICS: 'false'
          WORKER_TARGETS: ${{ steps.detect.outputs.targets }}
        run: |
          set -euo pipefail
          # Refuse an older checkout if another source change already reached main.
          git fetch -q origin main
          for w in $WORKER_TARGETS; do
            dir="cloudflare/workers/$w"
            if [ ! -d "$dir" ]; then
              echo "::warning::$dir not found — skipping"
              continue
            fi
            git diff --exit-code "$GITHUB_SHA" origin/main -- "$dir" .github/workflows/deploy-workers.yml scripts/worker_release.py aws/ops/checks/worker_source_evidence.py aws/ops/checks/worker_release_evidence.py > /dev/null
            if [ "$w" = 'justhodl-data-proxy' ]; then
              wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-build" --config "$dir/wrangler.toml"
              python3 scripts/worker_release.py before --build-dir "$RUNNER_TEMP/worker-build" --evidence-dir "$RUNNER_TEMP/worker-evidence" --commit "$GITHUB_SHA"
            fi
            echo "──── Deploying $w ────"
            cd "$dir"

            # Deploy first so secrets can be attached
            wrangler deploy

            # Attach the Lambda auth token as an encrypted Worker Secret
            if [ "$w" = "justhodl-ai-proxy" ]; then
              echo "$AI_CHAT_TOKEN" | wrangler secret put AI_CHAT_TOKEN
              echo "$PORTFOLIO_ADMIN_TOKEN" | wrangler secret put PORTFOLIO_ADMIN_TOKEN
              echo "$PORTFOLIO_MGR_PASS" | wrangler secret put PORTFOLIO_MGR_PASS
            fi
            # Yahoo proxy uses the same shared token for simplicity
            if [ "$w" = "justhodl-yahoo-proxy" ]; then
              echo "$AI_CHAT_TOKEN" | wrangler secret put PROXY_TOKEN
            fi
            if [ "$w" = "justhodl-data-proxy" ]; then
              if [ -n "$STRIPE_SECRET" ]; then echo "$STRIPE_SECRET" | wrangler secret put STRIPE_SECRET; fi
              if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then echo "$STRIPE_WEBHOOK_SECRET" | wrangler secret put STRIPE_WEBHOOK_SECRET; fi
              if [ -n "$SUPABASE_SERVICE_KEY" ]; then echo "$SUPABASE_SERVICE_KEY" | wrangler secret put SUPABASE_SERVICE_KEY; fi
              if [ -n "${ADMIN_TOKEN:-}" ]; then echo "$ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN; fi
              if [ -n "${POLYGON_KEY:-}" ]; then echo "$POLYGON_KEY" | wrangler secret put POLYGON_KEY; fi
              if [ -n "${FRED_KEY:-}" ]; then echo "$FRED_KEY" | wrangler secret put FRED_KEY; fi
              if [ -n "${FMP_KEY:-}" ]; then echo "$FMP_KEY" | wrangler secret put FMP_KEY; fi
            fi

            echo "✅ $w deployed"
            cd - > /dev/null
            if [ "$w" = 'justhodl-data-proxy' ]; then
              python3 scripts/worker_release.py after --build-dir "$RUNNER_TEMP/worker-build" --evidence-dir "$RUNNER_TEMP/worker-evidence" --commit "$GITHUB_SHA"
              aws s3 cp data/ops/releases/worker-justhodl-data-proxy.json s3://justhodl-dashboard-live/data/ops/releases/worker-justhodl-data-proxy.json --content-type application/json --cache-control 'no-store' --only-show-errors
            fi
          done

      - name: Retain complete Worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-source-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/worker-evidence/
            ${{ runner.temp }}/worker-build/
            aws/ops/reports/worker-source/release-${{ github.run_id }}.json
          if-no-files-found: ignore

      - name: Commit exact Worker receipt and full code capture
        if: always()
        run: |
          set -euo pipefail
          artifact="aws/ops/reports/worker-source/release-${GITHUB_RUN_ID}.json"
          if [ ! -f "$artifact" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$artifact" data/ops/releases/worker-justhodl-data-proxy.json
          git commit -m "Record exact Worker release ${GITHUB_SHA:0:10} [skip-deploy] [skip-ops]"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            sleep $((i * 7))
          done
          test "$pushed" = 1

      - name: Summary
        if: always()
        run: |
          echo "### Cloudflare Workers Deploy" >> $GITHUB_STEP_SUMMARY
          echo "Targets: \`${{ steps.detect.outputs.targets }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
