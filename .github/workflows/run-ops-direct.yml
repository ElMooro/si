# Direct ops dispatch (2026-09-15): run ONE named ops script now, outside the serial run-ops queue (no ledger, no
# auto-commit to main). For urgent, idempotent ops that must not wait behind an hour-long job. The report is
# published to the ops-evidence branch; the same script will also run in the serial lane when its turn comes (idempotent).
name: Run ops script (direct)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'path under aws/ops/, e.g. pending/ops_5576_provider_keys_reconcile.py'
        required: true
permissions:
  contents: write
concurrency:
  group: run-ops-direct
  cancel-in-progress: false
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Preflight + run
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python3 -m pip install -q boto3 requests
          python3 aws/ops/_preflight.py "aws/ops/${{ github.event.inputs.script }}"
          rc=0
          python3 "aws/ops/${{ github.event.inputs.script }}" || rc=$?
          echo "OPS_RC=$rc" >> "$GITHUB_ENV"
          [ "$rc" = 0 ] || echo "::warning::script exited $rc -- its report is committed below, then this run goes red (2026-09-17: a failed op no longer hides behind a green run)"
      - name: Commit the report to main ([skip-deploy] [skip-ops])
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aws/ops/reports/latest/*.md aws/ops/reports/5576_provider_keys.json 2>/dev/null || git add aws/ops/reports/latest/*.md
          git commit -q -m "ops(direct): report from run ${{ github.run_id }} [skip-deploy] [skip-ops]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break || sleep $((i * 7)); done

      - name: Fail the run if the script failed (after its report was pushed)
        if: always() && env.OPS_RC != '' && env.OPS_RC != '0'
        run: |
          echo "::error::ops script exited ${OPS_RC} -- read aws/ops/reports/latest/<N>_<slug>.md on main"
          exit 1
