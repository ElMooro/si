name: Audit release progress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-progress.yml'
      - 'scripts/audit_release_progress.py'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Lambdas, Run Ops Script]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: audit-release-progress
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_release_progress.py
      - name: Commit metadata evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/latest/audit_release_progress.json
          git commit -m 'audit: record release workflow progress [skip-deploy] [skip-ops]' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
