name: Audit release progress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-progress.yml'
      - 'scripts/audit_release_progress.py'
      - 'scripts/audit_public_api_status.py'
      - 'scripts/audit_public_pages.py'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Lambdas, Run Ops Script, Deploy site to Pages]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: audit-release-progress
  cancel-in-progress: true
jobs:
  public-pages:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy site to Pages' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every published route against the completed deployment
        env:
          AUDIT_PAGES_DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          AUDIT_PAGES_DEPLOYMENT_RUN: ${{ github.event.workflow_run.id }}
        run: python3 scripts/audit_public_pages.py
      - name: Preserve public HTML verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-page-sweep-${{ github.run_id }}
          path: aws/ops/reports/5275_public_page_sweep.json
          retention-days: 30
      - name: Commit public HTML verification metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/5275_public_page_sweep.json
          python3 scripts/commit_ops_evidence.py --run-id '${{ github.run_id }}' --job-status '${{ job.status }}'
  public-api:
    # Public HTTP GETs only. This job cannot access runner AWS credentials and
    # need not wait for the serialized cloud migration/deployment queue.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public engine response and CORS metadata
        run: python3 scripts/audit_public_api_status.py
      - name: Commit public response metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/5272_public_api_runtime.json
          git commit -m 'audit: record public FMP HTTP metadata [skip-deploy] [skip-ops]' || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_release_progress.py
      - name: Commit metadata evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/latest/audit_release_progress.json
          git commit -m 'audit: record release workflow progress [skip-deploy] [skip-ops]' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
