name: Audit release progress
# Deploy lane v2 (2026-09-11): receipts are published to the ops-evidence branch.
# This workflow used to commit 2-3 files to main after EVERY completed workflow
# (117 bot commits on 2026-09-11), racing every lane's push and burying real
# history. Same receipts, same retention, zero main churn.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-progress.yml'
      - 'scripts/audit_release_progress.py'
      - 'scripts/audit_public_api_status.py'
      - 'scripts/audit_public_pages.py'
  workflow_dispatch:
    inputs:
      pages_deployed_sha:
        description: 'Full SHA of a confirmed successful Pages deployment to recheck (read-only)'
        required: false
        default: ''
        type: string
      pages_deployment_run:
        description: 'Successful Pages deployment run ID corresponding to that SHA'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [Deploy Lambdas, Run Ops Script, Deploy site to Pages]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  # Lambda/ops completion must not cancel the full Pages evidence sweep.
  group: audit-release-progress-${{ github.event.workflow_run.name || github.event_name }}
  cancel-in-progress: true
jobs:
  public-pages:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy site to Pages' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.pages_deployed_sha != '' && inputs.pages_deployment_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Check every published route against the completed deployment
        env:
          AUDIT_PAGES_DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || inputs.pages_deployed_sha }}
          AUDIT_PAGES_DEPLOYMENT_RUN: ${{ github.event.workflow_run.id || inputs.pages_deployment_run }}
        run: python3 scripts/audit_public_pages.py
      - name: Preserve public HTML verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-page-sweep-${{ github.run_id }}
          path: aws/ops/reports/5275_public_page_sweep.json
          retention-days: 30
      - name: Publish public HTML verification receipt (ops-evidence branch, never main)
        run: |
          python3 scripts/push_evidence.py --run-id '${{ github.run_id }}' --message 'audit: public page sweep' aws/ops/reports/5275_public_page_sweep.json
  public-api:
    # Public HTTP GETs only. This job cannot access runner AWS credentials and
    # need not wait for the serialized cloud migration/deployment queue.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Check public engine response and CORS metadata
        run: python3 scripts/audit_public_api_status.py
      - name: Publish public response receipt (ops-evidence branch, never main)
        run: |
          python3 scripts/push_evidence.py --run-id '${{ github.run_id }}' --message 'audit: public FMP HTTP metadata' aws/ops/reports/5272_public_api_runtime.json
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Read release job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_release_progress.py
      - name: Publish release-progress receipt (ops-evidence branch, never main)
        run: |
          python3 scripts/push_evidence.py --run-id '${{ github.run_id }}' --message 'audit: release workflow progress' aws/ops/reports/latest/audit_release_progress.json
