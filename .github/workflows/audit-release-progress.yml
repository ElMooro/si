name: Audit release progress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-progress.yml'
      - 'scripts/audit_release_progress.py'
      - 'scripts/audit_public_api_status.py'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Lambdas, Run Ops Script]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: audit-release-progress
  cancel-in-progress: true
jobs:
  public-api:
    # Public HTTP GETs only. This job cannot access runner AWS credentials and
    # need not wait for the serialized cloud migration/deployment queue.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public engine response and CORS metadata
        run: python3 scripts/audit_public_api_status.py
      - name: Commit public response metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/5272_public_api_runtime.json
          git commit -m 'audit: record public FMP HTTP metadata [skip-deploy] [skip-ops]' || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_release_progress.py
      - name: Commit metadata evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/ops/reports/latest/audit_release_progress.json
          git commit -m 'audit: record release workflow progress [skip-deploy] [skip-ops]' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
