name: Read-only audit release observation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-release-observation.yml'
      - 'scripts/audit_release_observation.py'
      - 'aws/ops/checks/audit_20260909_release.py'
      - 'tests/test_audit_release_observation.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit-release-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_RELEASE_SHA: 9a9832328a193cf2a0db3e83908d3327bb4939f8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Verify read-only SDK boundary
        run: python tests/test_audit_release_observation.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Compare packages, schedules and publications
        run: python scripts/audit_release_observation.py
      - name: Preserve observation before committing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-release-observation-${{ github.run_id }}
          path: aws/ops/reports/5283_release_observation.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish observation receipt (ops-evidence branch, never main)
        if: always()
        run: |
          test -f aws/ops/reports/5283_release_observation.json
          mkdir -p aws/ops/reports/observations
          cp aws/ops/reports/5283_release_observation.json 'aws/ops/reports/observations/5283_${{ github.run_id }}.json'
          python3 scripts/push_evidence.py --run-id '${{ github.run_id }}' --message 'audit: release observation' \
            aws/ops/reports/5283_release_observation.json 'aws/ops/reports/observations/5283_${{ github.run_id }}.json'
