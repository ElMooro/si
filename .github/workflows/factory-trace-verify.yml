# Verify an owned burst (2026-09-14): traces from generate.py -> joined with the public tasks' tests (fetched
# here, never sent to the model) -> executed in a network-less, unprivileged container -> passes written as
# self_trace curriculum rows (license own, verified_by owner_runner) that gear_b.curate consumes. Keep-only-passes.
name: Factory trace verify
on:
  workflow_dispatch:
    inputs:
      burst:
        description: 'SageMaker training job name of the burst (jh-burst-...)'
        required: true
      sources:
        description: 'curriculum sources to refetch tests from'
        required: false
        default: 'mbpp,apps'
      all_samples:
        description: 'keep every passing sample per task (default: one row per task)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: factory-trace-verify
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      traces: ${{ steps.pull.outputs.traces }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Pull the burst output and refetch the public tasks (with tests)
        id: pull
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          pip install --quiet boto3 datasets
          mkdir -p work
          python3 - <<'PY'
          import boto3, json, os, tarfile
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
          bucket = "justhodl-ai-857687956942"
          rec = json.loads(s3.get_object(Bucket=bucket, Key="factory/bursts/jobs/${{ github.event.inputs.burst }}.json")["Body"].read())
          out_uri = rec["out_uri"]
          key = out_uri.split(bucket + "/", 1)[1] + "${{ github.event.inputs.burst }}/output/model.tar.gz"
          s3.download_file(bucket, key, "work/model.tar.gz")
          with tarfile.open("work/model.tar.gz") as t:
              t.extractall("work/burst", filter="data")
          print(json.dumps({"key": key, "files": sorted(os.listdir("work/burst"))}))
          PY
          test -f work/burst/traces.jsonl
          python3 scripts/factory_oss_curriculum.py fetch --sources "${{ github.event.inputs.sources }}" --max 5000 --out work/candidates.jsonl
          python3 - <<'PY'
          import boto3, json, os
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
          m = json.loads(s3.get_object(Bucket="justhodl-ai-857687956942", Key="factory/holdout/manifest.json")["Body"].read())   # fail CLOSED: no manifest, no verify
          ids = (m.get("code") or {}).get("task_ids") or []
          if not ids:
              raise SystemExit("holdout manifest has no code task_ids; refusing to verify without holdout protection")
          json.dump({"ids": ids}, open("work/holdout-ids.json", "w"))
          print("holdout ids:", len(ids))
          PY
          python3 - <<'PY'
          import boto3, json, os
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
          b = "justhodl-ai-857687956942"
          with open("work/task-cards.jsonl", "w") as f:
              for o in s3.list_objects_v2(Bucket=b, Prefix="factory/queue/tasks/task-", MaxKeys=500).get("Contents", []):
                  if "-result-" in o["Key"]:
                      continue
                  f.write(json.dumps(json.loads(s3.get_object(Bucket=b, Key=o["Key"])["Body"].read())) + "\n")
          PY
          python3 scripts/factory_trace_verify.py join --traces work/burst/traces.jsonl --candidates work/candidates.jsonl --out work/joined.jsonl --holdout-ids work/holdout-ids.json --task-cards work/task-cards.jsonl
          cp scripts/factory_code_verify.py work/verify.py
          echo "traces=$(wc -l < work/burst/traces.jsonl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: joined
          path: |
            work/joined.jsonl
            work/verify.py
  verify:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: joined
          path: work
      - name: Execute every candidate in a network-less, unprivileged container
        run: |
          set -euo pipefail
          docker run --rm --network none --memory 1g --cpus 1 --pids-limit 256 \
            --read-only --tmpfs /tmp:rw,size=256m -v "$PWD/work:/work:rw" \
            -w /work python:3.12-slim sh -c 'chmod 700 /work && python /work/verify.py /work/joined.jsonl /work/verified.jsonl'
      - uses: actions/upload-artifact@v4
        with:
          name: verified
          path: |
            work/verified.jsonl
            work/verified.jsonl.failures.jsonl
  write:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: verified
          path: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Write passes as self_trace rows + verdicts (create-if-absent)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          pip install --quiet boto3
          EXTRA=""
          if [ "${{ github.event.inputs.all_samples }}" = "true" ]; then EXTRA="--all-samples"; fi
          python3 scripts/factory_trace_verify.py write --in work/verified.jsonl --burst "${{ github.event.inputs.burst }}" --run-id "${{ github.run_id }}" $EXTRA
