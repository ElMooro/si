name: Apply staged large-file patches

on:
  push:
    branches: [main]
    paths:
      - 'aws/ops/staged/grok_*.py'
      - '.github/workflows/apply-staged-large-files.yml'
      - 'scripts/guard_stub_lambdas.py'
  workflow_dispatch:
    inputs:
      patcher:
        description: 'Optional single patcher filename under aws/ops/staged/'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apply-staged-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply grok staged patchers
        env:
          PATCHER: ${{ github.event.inputs.patcher }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "${PATCHER:-}" ]; then
            f="aws/ops/staged/${PATCHER}"
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
            echo "── $f"
            python3 "$f"
          else
            found=0
            for f in aws/ops/staged/grok_*.py; do
              echo "── $f"
              python3 "$f"
              found=1
            done
            if [ "$found" != 1 ]; then
              echo "no aws/ops/staged/grok_*.py patchers"
            fi
          fi

      - name: Compile changed lambda sources
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- 'aws/lambdas/*/source/*.py')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no lambda source diffs"
            exit 0
          fi
          python3 -m py_compile "${changed[@]}"
          echo "compiled ${#changed[@]} file(s)"

      - name: Guard against stub bodies
        run: python3 scripts/guard_stub_lambdas.py

      - name: Commit and push patched tracked files
        run: |
          set -euo pipefail
          git config user.email "github-actions@justhodl.ai"
          git config user.name "github-actions"
          git add -u
          if git diff --cached --quiet; then
            echo "no tracked-file changes after patchers"
            exit 0
          fi
          python3 scripts/guard_stub_lambdas.py
          git commit -m "apply staged large-file patch from runner"
          git pull --rebase origin main
          git push origin main
