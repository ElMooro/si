# Grade a frozen-exam run (2026-09-14): pull the exam job's completions, join with the PRIVATE tests on the runner (root),
# execute in the network-less container with /work root-only, write the promotion-shaped evaluation. The exam job itself
# only ever saw prompts.
# 2026-09-17: also runs on a schedule -- it grades every exam job the Gear B tick launched (kind=exam, SageMaker Completed,
# no evaluation yet), so a candidate goes trained -> examined -> decided without a human dispatch. One exam per run.
name: Factory exam grade
on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      burst:
        description: 'SageMaker job name of the exam run (jh-exam-...); empty = grade the oldest completed ungraded exam job'
        required: false
        default: ''
      generation:
        description: 'gen-0 for the base model, gen-N for a candidate adapter (used only with burst)'
        required: false
        default: 'gen-0'
permissions:
  contents: read
concurrency:
  group: factory-exam
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Resolve the exam to grade (dispatch inputs, or the oldest completed ungraded exam job)
        id: resolve
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IN_BURST: ${{ github.event.inputs.burst }}
          IN_GEN: ${{ github.event.inputs.generation }}
        run: |
          set -euo pipefail
          pip install --quiet boto3
          # Only key=value lines may reach $GITHUB_OUTPUT (a free-text line fails the step with "Invalid format").
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import boto3, json, os, sys
          def note(*a): print(*a, file=sys.stderr)
          burst, gen = os.environ.get("IN_BURST") or "", os.environ.get("IN_GEN") or ""
          if not burst:
              gen = ""
              b = "justhodl-ai-857687956942"
              region = os.environ.get("AWS_REGION", "us-east-1")
              s3 = boto3.client("s3", region_name=region)
              sm = boto3.client("sagemaker", region_name=region)
              def docs(prefix):
                  token = None
                  while True:
                      kw = {"Bucket": b, "Prefix": prefix, "MaxKeys": 1000}
                      if token: kw["ContinuationToken"] = token
                      page = s3.list_objects_v2(**kw)
                      for o in page.get("Contents", []):
                          if not o["Key"].endswith(".json") or o["Key"].endswith(".terminal.json"):
                              continue
                          try:
                              yield o["Key"], json.loads(s3.get_object(Bucket=b, Key=o["Key"])["Body"].read())
                          except Exception as e:
                              note("skip %s: %s" % (o["Key"], e))
                      token = page.get("NextContinuationToken")
                      if not token: break
              graded = {d["burst"] for _, d in docs("factory/exams/code/results/") if isinstance(d, dict) and d.get("burst")}
              recs = [d for _, d in docs("factory/bursts/jobs/")
                      if isinstance(d, dict) and d.get("kind") == "exam" and d.get("job_name") and d["job_name"] not in graded]
              note("ungraded exam records: %d (graded: %d)" % (len(recs), len(graded)))
              for d in sorted(recs, key=lambda r: str(r.get("launched_at") or "")):
                  try:
                      st = sm.describe_training_job(TrainingJobName=d["job_name"]).get("TrainingJobStatus")
                  except Exception as e:
                      note("describe %s failed: %s" % (d["job_name"], e)); continue
                  note("  %s -> %s" % (d["job_name"], st))
                  if st == "Completed":
                      burst, gen = d["job_name"], str(d.get("exam_generation") or "gen-0"); break
          print("burst=%s" % burst); print("generation=%s" % (gen or "gen-0")); print("skip=%s" % ("false" if burst else "true"))
          note("resolved:", burst or "(nothing to grade -- clean no-op)", gen or "gen-0")
          PY
      - name: Pull completions + private exam
        if: steps.resolve.outputs.skip != 'true'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BURST: ${{ steps.resolve.outputs.burst }}
        run: |
          set -euo pipefail
          pip install --quiet boto3
          mkdir -p work
          python3 - <<'PY'
          import boto3, json, os, tarfile
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
          b = "justhodl-ai-857687956942"
          burst = os.environ["BURST"]
          rec = json.loads(s3.get_object(Bucket=b, Key="factory/bursts/jobs/%s.json" % burst)["Body"].read())
          key = rec["out_uri"].split(b + "/", 1)[1] + burst + "/output/model.tar.gz"
          s3.download_file(b, key, "work/model.tar.gz")
          with tarfile.open("work/model.tar.gz") as t:
              t.extractall("work/burst", filter="data")
          for k, name in (("factory/exams/code/holdout-prompts.jsonl", "prompts.jsonl"), ("factory/exams/code/holdout-tests.jsonl", "tests.jsonl")):
              s3.download_file(b, k, "work/" + name)
          print(sorted(os.listdir("work/burst")))
          PY
          test -f work/burst/exam.jsonl
          cp scripts/factory_code_verify.py scripts/factory_exam.py work/
      - name: Grade in the network-less container (tests root-only)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --memory 2g --cpus 2 --pids-limit 512 \
            --read-only --tmpfs /tmp:rw,size=512m -v "$PWD/work:/work:rw" -w /work python:3.12-slim \
            sh -c 'chmod 700 /work && python /work/factory_exam.py grade --completions /work/burst/exam.jsonl --tests /work/tests.jsonl --prompts /work/prompts.jsonl --generation "${{ steps.resolve.outputs.generation }}" --run-id "${{ github.run_id }}" --burst "${{ steps.resolve.outputs.burst }}" --out /work/result.json' | tee work/grade.log
      - name: Write the evaluation
        if: steps.resolve.outputs.skip != 'true'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          sudo chmod -R a+rX work
          python3 scripts/factory_exam.py upload --result work/result.json

  serve:
    # 2026-09-23: a promoted champion's merged weights (Gear B merge_pending -> merge_adapter.py) are swapped onto the owned
    # endpoint here, blue/green, with the scale-to-zero registration re-applied and a proof round trip. No-op otherwise.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Serve the champion (no-op unless merged weights are waiting)
        run: |
          pip install --quiet boto3
          python3 scripts/factory_serve_champion.py | tee "$RUNNER_TEMP/serve.log"
          { echo "### Serve champion"; echo '```'; tail -3 "$RUNNER_TEMP/serve.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
