# Grade a frozen-exam run (2026-09-14): pull the exam job's completions, join with the PRIVATE tests on the runner (root),
# execute in the network-less container with /work root-only, write the promotion-shaped evaluation. The exam job itself
# only ever saw prompts.
name: Factory exam grade
on:
  workflow_dispatch:
    inputs:
      burst:
        description: 'SageMaker job name of the exam run (jh-exam-...)'
        required: true
      generation:
        description: 'gen-0 for the base model, gen-N for a candidate adapter'
        required: true
        default: 'gen-0'
permissions:
  contents: read
concurrency:
  group: factory-exam
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Pull completions + private exam
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          pip install --quiet boto3
          mkdir -p work
          python3 - <<'PY'
          import boto3, json, os, tarfile
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_REGION", "us-east-1"))
          b = "justhodl-ai-857687956942"
          rec = json.loads(s3.get_object(Bucket=b, Key="factory/bursts/jobs/${{ github.event.inputs.burst }}.json")["Body"].read())
          key = rec["out_uri"].split(b + "/", 1)[1] + "${{ github.event.inputs.burst }}/output/model.tar.gz"
          s3.download_file(b, key, "work/model.tar.gz")
          with tarfile.open("work/model.tar.gz") as t:
              t.extractall("work/burst", filter="data")
          for k, name in (("factory/exams/code/holdout-prompts.jsonl", "prompts.jsonl"), ("factory/exams/code/holdout-tests.jsonl", "tests.jsonl")):
              s3.download_file(b, k, "work/" + name)
          print(sorted(os.listdir("work/burst")))
          PY
          test -f work/burst/exam.jsonl
          cp scripts/factory_code_verify.py scripts/factory_exam.py work/
      - name: Grade in the network-less container (tests root-only)
        run: |
          set -euo pipefail
          docker run --rm --network none --memory 2g --cpus 2 --pids-limit 512 \
            --read-only --tmpfs /tmp:rw,size=512m -v "$PWD/work:/work:rw" -w /work python:3.12-slim \
            sh -c 'chmod 700 /work && python /work/factory_exam.py grade --completions /work/burst/exam.jsonl --tests /work/tests.jsonl --prompts /work/prompts.jsonl --generation "${{ github.event.inputs.generation }}" --run-id "${{ github.run_id }}" --burst "${{ github.event.inputs.burst }}" --out /work/result.json' | tee work/grade.log
      - name: Write the evaluation
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          sudo chmod -R a+rX work
          python3 scripts/factory_exam.py upload --result work/result.json
