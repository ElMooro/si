name: Deploy Lambdas

# Triggers whenever Claude (or anyone) pushes changes under aws/lambdas/*/source/**
# Detects which lambda changed, zips its source/ dir, and updates the live function.
on:
  push:
    branches: [main]
    paths:
      - 'aws/lambdas/*/source/**'
      - 'aws/lambdas/*/config.json'
      # Shared modules are bundled into every Lambda zip. A change here must
      # fire this workflow so the detect step can redeploy the importers
      # (the 2026-06-29 hardening added the handling but not this trigger path).
      - 'aws/shared/**/*.py'
      - 'aws/shared/*.py'
      - 'aws/lambdas/*/tests/**'
      - 'tests/deployment/**'
      - 'scripts/deploy_*.sh'
      - 'scripts/protect_lambda_alias.py'
      - 'scripts/prime_governed_aliases.py'
      - 'scripts/release_order.py'
      - 'scripts/pin_release_checkout.py'
      - 'scripts/validate_lambda_configs.py'
      - 'scripts/lambda_config_environment.py'
      - 'scripts/secret_lambda_config.py'
      - 'scripts/normalize_lambda_config.py'
      - 'scripts/scheduler_payload.py'
      - 'tests/test_brain_public_boundaries.py'
      - '.github/workflows/deploy-lambdas.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Lambda name to redeploy. Special values: MISSING (deploy only undeployed), ALL (redeploy every Lambda). Blank = nothing.'
        required: false
        default: ''
      base_sha:
        description: 'Recovery only: full40hex ancestor commit SHA covering the failed release'
        required: false
        default: ''
      expected_sha:
        description: 'Optional full40hex source commit; exact checkout requires matching workflow definition'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-lambdas-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed Lambdas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Pin exact recovery checkout
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_sha }}
          TRIGGERING_RELEASE_SHA: ${{ github.event.after || github.sha }}
          RECOVERY_BASE_SHA: ${{ github.event.inputs.base_sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/pin_release_checkout.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Detect changed Lambdas
        id: detect
        env:
          RECOVERY_BASE_SHA: ${{ github.event.inputs.base_sha }}
          EXPECTED_RELEASE_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -e
          # Use the actual commit that triggered this workflow, not HEAD —
          # during rapid multi-push sequences HEAD may be newer than the
          # triggering event's sha, causing diffs to miss the real change.
          triggering_sha="${{ github.event.after || github.sha }}"
          parent_sha="${{ github.event.before }}"
          if [ -n "$EXPECTED_RELEASE_SHA" ]; then
            [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "::error::expected_sha must be full40hex"; exit 1; }
            EXPECTED_RELEASE_SHA="${EXPECTED_RELEASE_SHA,,}"
            [ "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA" ] || { echo "::error::Release commit changed after verified checkout; refusing deployment"; exit 1; }
            triggering_sha="$EXPECTED_RELEASE_SHA"
          fi
          if [ -n "$RECOVERY_BASE_SHA" ]; then
            [[ "$RECOVERY_BASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "::error::base_sha must be full40hex"; exit 1; }
            [ -z "${{ github.event.inputs.function }}" ] || { echo "::error::Recovery base_sha and explicit function are mutually exclusive"; exit 1; }
            parent_sha="$RECOVERY_BASE_SHA"
          fi
          echo "Triggering commit: $triggering_sha"
          echo "Parent commit: $parent_sha"
          # audit 2026-09-08 (2026-09-09 incident): a 10-commit push exceeded the shallow clone, the
          # parent diff failed silently and ZERO engines deployed. Fetch both push boundaries explicitly
          # and refuse to proceed with an empty diff when the range is non-empty.
          if [ -n "$parent_sha" ] && [ "$parent_sha" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --depth=200 origin "$parent_sha" "$triggering_sha" 2>/dev/null || git fetch -q --unshallow origin 2>/dev/null || true
            if ! git cat-file -e "$parent_sha" 2>/dev/null; then
              echo "::error::parent commit $parent_sha not reachable after fetch -- refusing to guess the change set"
              exit 1
            fi
          fi

          if [ -n "$RECOVERY_BASE_SHA" ]; then
            git merge-base --is-ancestor "$parent_sha" "$triggering_sha" || { echo "::error::Recovery base_sha is not an ancestor of this release"; exit 1; }
          fi

          # Check the specific triggering commit's message for [skip-deploy].
          # Manual workflow_dispatch invocations bypass this — the user
          # explicitly asked for deployment so the most-recent commit's tag
          # is irrelevant (otherwise auto-commits with [skip-deploy] block
          # all subsequent manual dispatches until the next real push).
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            commit_msg=$(git log -1 --pretty=%B "$triggering_sha" 2>/dev/null || git log -1 --pretty=%B)
            if echo "$commit_msg" | grep -qF '[skip-deploy]'; then
              echo "Commit message contains [skip-deploy] — exiting"
              echo "targets=" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "workflow_dispatch event — ignoring [skip-deploy] check"
          fi

          if [ -n "${{ github.event.inputs.function }}" ]; then
            input="${{ github.event.inputs.function }}"
            if [ "$input" = "MISSING" ]; then
              # Scan all aws/lambdas/*/source/ dirs; deploy any Lambda whose function
              # name doesn't yet exist in AWS. Recovery path for past CI failures.
              echo "Manual dispatch in MISSING mode -- scanning for undeployed Lambdas"
              all_missing=""
              for d in aws/lambdas/*/; do
                fn=$(basename "$d")
                [ ! -d "$d/source" ] && continue
                if ! aws lambda get-function --function-name "$fn" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1; then
                  all_missing="$all_missing $fn"
                  echo "  MISSING: $fn"
                fi
              done
              targets=$(echo "$all_missing" | xargs)
              echo "Found $(echo $targets | wc -w) missing Lambdas"
              echo "targets=$targets" >> $GITHUB_OUTPUT
            elif [ "$input" = "ALL" ]; then
              # Scan and redeploy EVERY Lambda. Use sparingly -- 200+ functions.
              echo "Manual dispatch in ALL mode -- redeploying everything"
              targets=$(ls -d aws/lambdas/*/ 2>/dev/null | xargs -n1 basename | paste -sd ' ' -)
              echo "targets=$targets" >> $GITHUB_OUTPUT
            else
              echo "Manual dispatch for: $input"
              echo "targets=$input" >> $GITHUB_OUTPUT
            fi
          else
            # Fallback to HEAD^ if we don't have both refs
            if [ -n "$parent_sha" ] && [ "$parent_sha" != "0000000000000000000000000000000000000000" ]; then
              range_files=$(git diff --name-only "$parent_sha" "$triggering_sha") || { echo "::error::git diff $parent_sha..$triggering_sha failed"; exit 1; }
              changed=$(echo "$range_files" | grep '^aws/lambdas/' || true)
              shared_changed=$(echo "$range_files" | grep -E '^aws/shared/.*\.py$' || true)
            else
              changed=$(git diff --name-only HEAD^ HEAD | grep '^aws/lambdas/' || true)
              shared_changed=$(git diff --name-only HEAD^ HEAD | grep -E '^aws/shared/.*\.py$' || true)
            fi
            targets=$(echo "$changed" | awk -F/ '{print $3}' | sort -u | paste -sd ' ' -)
            # Harden (2026-06-29): a changed shared module must redeploy the
            # Lambdas that import it — previously aws/shared/ edits triggered NO
            # redeploys, so consumers silently ran stale shared code (the
            # llm_router-not-bundled class of bug). Bounded to actual importers.
            if [ -n "$shared_changed" ]; then
              # Transitive closure (2026-07-05): a changed shared module must also
              # count shared modules that IMPORT it (llm_router change must redeploy
              # anthropic_shim's importers too) — previously transitive consumers
              # kept stale bundles (the ka/khalid-metrics class of bug).
              smods=""
              for sp in $shared_changed; do smods="$smods $(basename "$sp" .py)"; done
              for _pass in 1 2 3; do
                grew=""
                for sm in $smods; do
                  while IFS= read -r sf; do
                    [ -z "$sf" ] && continue
                    m=$(basename "$sf" .py)
                    case " $smods $grew " in *" $m "*) ;; *) grew="$grew $m";; esac
                  done < <(grep -rlE "(from|import)[[:space:]]+${sm}([^a-zA-Z0-9_]|\$)" aws/shared/*.py 2>/dev/null || true)
                done
                [ -z "$grew" ] && break
                smods="$smods$grew"
              done
              extra=""
              for smod in $smods; do
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  extra="$extra $(echo "$f" | awk -F/ '{print $3}')"
                done < <(grep -rlE "(from|import)[[:space:]]+${smod}([^a-zA-Z0-9_]|\$)" aws/lambdas/*/source/ 2>/dev/null || true)
              done
              targets=$(echo "$targets $extra" | tr ' ' '\n' | grep -v '^$' | sort -u | paste -sd ' ' -)
              echo "Shared changed ($shared_changed) -> redeploying importers:$extra"
            fi
            echo "Changed Lambdas: $targets"
            echo "targets=$targets" >> $GITHUB_OUTPUT
          fi

      - name: Run deployment preflight tests
        if: steps.detect.outputs.targets != ''
        run: |
          set -euo pipefail
          python3 scripts/validate_lambda_configs.py ${{ steps.detect.outputs.targets }}

          # These static deployment tests and every selected Lambda's local
          # checks complete before the deployment step can mutate AWS.
          python3 -m pip install -q boto3
          python3 scripts/check_secrets.py
          python3 tests/deployment/run_tests.py
          if [ -f tests/test_brain_public_boundaries.py ]; then
            python3 tests/test_brain_public_boundaries.py
          fi
          for fn in ${{ steps.detect.outputs.targets }}; do
            dir="aws/lambdas/$fn"
            [ -d "$dir/source" ] || continue

            python_sources=("$dir/source/"*.py)
            if [ -e "${python_sources[0]}" ]; then
              python3 -m py_compile "${python_sources[@]}"
            fi

            case "$fn" in
              justhodl-settlement-fails|justhodl-engine-fusion|justhodl-khalid-risk|justhodl-khalid|justhodl-katlin|justhodl-risk-sizer|justhodl-risk-gate|justhodl-tradingview|justhodl-portfolio-admin|justhodl-portfolio-snapshot|justhodl-calibration-snapshotter|justhodl-backtest-engine|justhodl-research-backtest|justhodl-outcome-checker|justhodl-fleet-freshness-monitor|justhodl-brain-sync|justhodl-journal-grader|justhodl-ask|justhodl-ask-desk|justhodl-ai-brief|justhodl-behavior-mirror|justhodl-pm-decision|justhodl-portfolio-risk|justhodl-portfolio-sizer|justhodl-portfolio-catalysts|justhodl-ai-chat|justhodl-history-api|justhodl-page-ai-commentary|justhodl-watchlist|justhodl-vol-regime|justhodl-trade-journal|justhodl-wealth-plan|justhodl-tax-plan|justhodl-fleet-monitor|justhodl-whats-changed|justhodl-public-archive-index|justhodl-ai-brief-router|justhodl-theme-classifier|justhodl-theme-rotation-engine|justhodl-fleet-error-monitor)
                if [ ! -f "$dir/tests/run_tests.py" ]; then
                  echo "::error::$fn requires dependency-free tests/run_tests.py"
                  exit 1
                fi
                ;;
            esac
            # audit 2026-09-08 INST-14: every changed engine that ships tests runs them before AWS is touched.
            if [ -f "$dir/tests/run_tests.py" ]; then
              echo "── $fn: tests/run_tests.py"
              python3 "$dir/tests/run_tests.py"
            elif ls "$dir/tests"/test_*.py >/dev/null 2>&1; then
              # engines without their own runner (jh-fusion, jhsignal-bridge, symdir, invest) run under pytest
              echo "── $fn: pytest"
              python3 -m pip install -q pytest
              PYTHONPATH="aws/shared:$dir/source:$dir/tests" python3 -m pytest -q "$dir/tests" -x
            fi
          done

      - name: Prime selected governed aliases before any code staging
        if: steps.detect.outputs.targets != ''
        run: |
          set -euo pipefail
          python3 scripts/prime_governed_aliases.py "${{ secrets.AWS_REGION }}" ${{ steps.detect.outputs.targets }}

      - name: Deploy each changed Lambda
        if: steps.detect.outputs.targets != ''
        env:
          DEPLOY_TARGETS: ${{ steps.detect.outputs.targets }}
          DEPLOY_AWS_REGION: ${{ secrets.AWS_REGION }}
        run: bash scripts/deploy_lambdas.sh

      - name: Preserve numbered candidate release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: ignore
      - name: Commit Function URL patches back
        run: |
          set -e
          # Check for any modified or new tracked files (excluding untracked)
          git config user.email "github-actions@justhodl.ai"
          git config user.name "github-actions"
          # Stage everything potentially touched by Function URL setup
          git add -A 'aws/lambdas/*/.function-url' 2>/dev/null || true
          # Also stage the explicitly patched file if set
          if [ -n "$FN_URL_PATCHED_FILE" ] && [ -f "$FN_URL_PATCHED_FILE" ]; then
            git add "$FN_URL_PATCHED_FILE"
          fi
          # And any HTML/JS that may have been patched
          git add 'ma/*.js' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing staged — no Function URL changes to commit"
            exit 0
          fi
          git status --short
          git commit -m "ops: auto-commit Function URL setup [skip-deploy]"
          git push origin main || echo "push failed — changes applied locally only"

      - name: Summary
        if: always()
        run: |
          echo "### Lambda Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Targets: \`${{ steps.detect.outputs.targets }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
