<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygon · JustHodl.AI</title>
<style>
:root{--bg:#0a0e14;--panel:#10151d;--bd:#1c2330;--tx:#e8edf4;--dim:#8b96a8;--pos:#00e676;--neg:#ff3d5a;--info:#22d3ee;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 -apple-system,Segoe UI,sans-serif}
a{color:var(--info);text-decoration:none}.wrap{max-width:1220px;margin:0 auto;padding:18px 16px 72px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--info);margin:18px 0 8px}
.sub{color:var(--dim)}.meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:8px 0 14px}.meta b{color:var(--info)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:12px}
.scroll{max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse}
th,td{padding:6px 10px;font-family:var(--mono);font-size:11px;text-align:right;border-bottom:1px solid rgba(28,35,48,.55)}
th.l,td.l{text-align:left}.pos{color:var(--pos)}.neg{color:var(--neg)}
.tabs button{background:var(--panel);color:var(--dim);border:1px solid var(--bd);border-radius:5px;padding:6px 10px;margin:0 6px 10px 0;cursor:pointer;font-family:var(--mono);font-size:11px}
.tabs button.on{background:var(--info);color:#0a0e14;border-color:var(--info);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <a href="/">← JustHodl.AI</a> · <a href="/finviz.html">finviz</a> · <a href="/data.html">data</a>
  <h1>Polygon / Massive</h1>
  <p class="sub">Stocks Starter + Options snippet + paid ETF Global (flows, constituents, profiles). 5418 LIVE 8/8 × 3 endpoints.</p>
  <div class="meta" id="meta">loading…</div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<script>
const S3="https://justhodl-dashboard-live.s3.us-east-1.amazonaws.com";
const FEEDS=[
  ["snap","data/polygon-snapshot.json"],
  ["si","data/polygon-short-interest.json"],
  ["news","data/polygon-news.json"],
  ["opt","data/polygon-options.json"],
  ["fin","data/polygon-ratios.json"],
  ["rel","data/polygon-related-graph.json"],
  ["etf","data/etf-global.json"],
  ["flows","data/etf-global-flows.json"],
  ["cons","data/etf-global-constituents.json"],
  ["prof","data/etf-global-profiles.json"]
];
let D={}, tab="ETF flows";
const pct=v=>v==null?"—":((Number(v)>0?"+":"")+Number(v).toFixed(2)+"%");
const cls=v=>v==null||isNaN(+v)?"":(+v>0?"pos":"neg");
function load(k){return fetch(S3+"/"+k+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)}
function tbl(rows, cols){
  if(!rows||!rows.length) return "<div style='padding:14px;color:var(--dim)'>empty</div>";
  const head="<tr>"+cols.map(c=>"<th class='"+(c.l?"l":"")+"'>"+c.h+"</th>").join("")+"</tr>";
  const body=rows.slice(0,80).map(r=>"<tr>"+cols.map(c=>{
    const v=r[c.k]; const show=c.fmt?c.fmt(v):(v==null?"—":v);
    return "<td class='"+(c.l?"l ":"")+(c.cls?c.cls(v):"")+"'>"+show+"</td>";
  }).join("")+"</tr>").join("");
  return "<div class='scroll'><table><thead>"+head+"</thead><tbody>"+body+"</tbody></table></div>";
}
function flatProd(doc){
  const out=[];
  const by=doc&&doc.by_ticker||{};
  Object.keys(by).forEach(tk=>(by[tk].results||[]).forEach(r=>out.push(Object.assign({etf:tk},r))));
  return out;
}
function render(){
  const names=["ETF flows","ETF holdings","ETF profiles","Snapshot","Short interest","News","Options"];
  document.getElementById("tabs").innerHTML=names.map(n=>"<button class='"+(n===tab?"on":"")+"' data-t='"+n+"'>"+n+"</button>").join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  let html="";
  if(tab==="ETF flows"){
    html+="<div class='card'>"+tbl(flatProd(D.flows),[
      {h:"ETF",k:"etf",l:1},{h:"Date",k:"effective_date",l:1},{h:"Flow $",k:"fund_flow",fmt:v=>v==null?"—":Number(v).toLocaleString()},
      {h:"NAV",k:"nav"},{h:"Shares",k:"shares_outstanding",fmt:v=>v==null?"—":Number(v).toLocaleString()}
    ])+"</div>";
  } else if(tab==="ETF holdings"){
    html+="<div class='card'>"+tbl(flatProd(D.cons),[
      {h:"ETF",k:"etf",l:1},{h:"Holding",k:"constituent_ticker",l:1},{h:"Name",k:"constituent_name",l:1},
      {h:"Weight",k:"weight"},{h:"MV",k:"market_value"},{h:"Rank",k:"constituent_rank"}
    ])+"</div>";
  } else if(tab==="ETF profiles"){
    html+="<div class='card'>"+tbl(flatProd(D.prof),[
      {h:"ETF",k:"composite_ticker",l:1},{h:"AUM",k:"aum"},{h:"Asset",k:"asset_class",l:1},
      {h:"Category",k:"category",l:1},{h:"Issuer",k:"issuer",l:1}
    ])+"</div>";
  } else if(tab==="Snapshot"){
    html+="<div class='card'>"+tbl((D.snap&&D.snap.tickers)||[],[
      {h:"Ticker",k:"ticker",l:1},{h:"Last",k:"day_c"},{h:"Chg %",k:"todaysChangePerc",fmt:pct,cls:cls},{h:"Vol",k:"day_v"}
    ])+"</div>";
  } else if(tab==="Short interest"){
    const rows=(D.si&&(D.si.rows||D.si.results||D.si.items))||[];
    const cols=rows[0]?Object.keys(rows[0]).slice(0,7).map((k,i)=>({h:k,k:k,l:i===0})):[{h:"—",k:"x"}];
    html+="<div class='card'>"+tbl(rows,cols)+"</div>";
  } else if(tab==="News"){
    const out=[]; const t=D.news&&D.news.tickers||{};
    Object.keys(t).forEach(sym=>(t[sym].items||[]).forEach(it=>out.push({ticker:sym,title:it.title,publisher:it.publisher,published_utc:it.published_utc})));
    html+="<div class='card'>"+tbl(out,[{h:"Ticker",k:"ticker",l:1},{h:"Title",k:"title",l:1},{h:"Pub",k:"publisher",l:1},{h:"UTC",k:"published_utc",l:1}])+"</div>";
  } else {
    const rows=(D.opt&&(D.opt.contracts||D.opt.results||D.opt.items))||[];
    const cols=rows[0]?Object.keys(rows[0]).slice(0,7).map((k,i)=>({h:k,k:k,l:!i})):[{h:"—",k:"x"}];
    html+="<div class='card'>"+tbl(rows,cols)+"</div>";
  }
  document.getElementById("view").innerHTML=html;
}
Promise.all(FEEDS.map(p=>load(p[1]).then(j=>(D[p[0]]=j)))).then(()=>{
  const e=D.etf||{};
  document.getElementById("meta").innerHTML="<b>"+(e.status||"")+"</b> flows "+((e.n_ok||{}).flows||0)+" · cons "+((e.n_ok||{}).constituents||0)+" · prof "+((e.n_ok||{}).profiles||0);
  render();
});
</script>
</body>
</html>
