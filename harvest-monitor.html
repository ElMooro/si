<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harvest Monitor — JustHodl.AI</title>
<!-- harvest-monitor v1-ops4061 -->
<style>:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--tx:#e6edf3;--dim:#8b949e;--amber:#F0B429;--green:#4CC38A;--red:#E07A6A;--blue:#7EA6F0}
*{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:18px;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
h1{font-size:20px;margin:0}.dim{color:var(--dim)}.mono{font-family:ui-monospace,Menlo,monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.big{font-size:26px;font-weight:800}.ok{color:var(--green)}.bad{color:var(--red)}.amb{color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:5px 8px;border-bottom:1px solid #1c2129;text-align:left}
button{background:var(--amber);color:#111;font-weight:800;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
</style></head><body>
<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
<h1>Harvest Monitor</h1>
<span class="dim">live view of every landing artifact · auto-refresh <span id="cd">30</span>s</span>
<button onclick="load()">refresh now</button></div>
<div class="grid" id="stats"></div>
<div class="card"><b>Harvest diagnostics</b> <span class="dim">(ships with every sync, even at zero)</span><div id="diag" class="mono" style="font-size:12px;margin-top:6px">—</div></div>
<div class="card" style="margin-top:10px"><b>Latest sources captured</b><div id="latest">—</div></div>
<div class="card" style="margin-top:10px"><b>Top sources</b><div id="tops">—</div></div>
<div class="card" style="margin-top:10px"><b>NEW sources (not yet in the system)</b> <span class="dim">from data/source-map.json</span><div id="newsrc">—</div></div>
<script>
const P='https://justhodl-data-proxy.raafouis.workers.dev/data/',S='https://s3.amazonaws.com/justhodl-dashboard-live/data/';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function gj(f){for(const b of[P,S]){try{const r=await fetch(b+f+'?v='+Date.now());if(r.ok)return await r.json()}catch(e){}}return null}
function ago(iso){if(!iso)return '—';const m=(Date.now()-new Date(iso))/60000;return m<1?'just now':m<60?Math.round(m)+' min ago':(m/60).toFixed(1)+' h ago'}
async function load(){
 const [src,wl,wb,map]=await Promise.all([gj('tv-sources.json'),gj('tv-watchlists.json'),gj('tv-workbench.json'),gj('source-map.json')]);
 const n=src?Object.keys(src.sources||{}).length:null;
 document.getElementById('stats').innerHTML=[
  ['sources landed',n===null?'<span class="amb">not born yet</span>':'<span class="ok">'+n+'</span>',src&&ago(src.generated_at)],
  ['watchlists',wl?((wl.lists||wl.watchlists||[]).length):'—',wl&&ago(wl.generated_at)],
  ['workbench (page)',wb?((wb.totals||{}).symbols_with_tv_source??0)+' sourced':'—',wb&&ago(wb.generated_at)],
  ['delta: NEW sources',map?((map.new_sources||[]).length):'<span class="dim">awaits sources</span>',map&&ago(map.generated_at)]
 ].map(([k,v,t])=>`<div class="card"><div class="dim" style="font-size:11px">${k}</div><div class="big">${v}</div><div class="dim" style="font-size:11px">${t||''}</div></div>`).join('');
 const d=src&&src.last_harvest_diag;
 document.getElementById('diag').innerHTML=d?`done <b>${d.done}/${d.total}</b> · symsearch <b class="ok">${d.ss_ok}</b>/<b class="bad">${d.ss_err}</b> · html <b class="ok">${d.html_ok}</b>/<b class="bad">${d.html_err}</b> · matched <b>${d.matched}</b>${d.first_err?` · first_err: <span class="bad">${esc(d.first_err)}</span>`:''}`:'<span class="dim">no diag yet — lands with the next sync</span>';
 if(src){const rows=Object.entries(src.sources||{}).sort((a,b)=>String(b[1].updated).localeCompare(String(a[1].updated))).slice(0,15);
  document.getElementById('latest').innerHTML='<table><tr><th>symbol</th><th>pulled from</th><th>when</th></tr>'+rows.map(([k,v])=>`<tr><td class="mono">${esc(k)}</td><td class="blue" style="color:var(--blue)">${esc(v.source)}</td><td class="dim">${ago(v.updated)}</td></tr>`).join('')+'</table>';
  const c={};Object.values(src.sources||{}).forEach(v=>{c[v.source]=(c[v.source]||0)+1});
  document.getElementById('tops').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([s2,n2])=>`<div style="display:flex;gap:8px"><b style="width:44px;text-align:right">${n2}</b><span>${esc(s2)}</span></div>`).join('');
 }
 if(map)document.getElementById('newsrc').innerHTML=(map.new_sources||[]).slice(0,15).map(x=>`<div style="display:flex;gap:8px"><b style="width:44px;text-align:right">${x.n_symbols}</b><span>${esc(x.source)}</span><span class="dim" style="font-size:11px">e.g. ${esc((x.examples||[]).join(', '))}</span></div>`).join('')||'<span class="dim">none yet</span>';
}
let cd=30;setInterval(()=>{cd--;if(cd<=0){cd=30;load()}document.getElementById('cd').textContent=cd},1000);load();
</script></body></html>
